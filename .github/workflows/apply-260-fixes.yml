name: Prepare Brauzio 2.6 Release Metadata

on:
  push:
    paths:
      - '.github/workflows/apply-260-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch 2.6 metadata and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cloud = Path('app/cloudflare-mcp/src/index.ts')
          text = cloud.read_text(encoding='utf-8')
          text = text.replace("const BRAUZIO_RUNTIME_VERSION = '2.5.0';", "const BRAUZIO_RUNTIME_VERSION = '2.6.0';", 1)
          text = text.replace("const BRAUZIO_SCHEMA_VERSION = 'v2.5.0-2026-09-06';", "const BRAUZIO_SCHEMA_VERSION = 'v2.6.0-2026-09-07';", 1)
          cloud.write_text(text, encoding='utf-8')

          changelog = Path('docs/CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          heading = '# Brauzio Changelog\n'
          entry = """

## 2026-09-07 — Extension V2.6.0 Human Takeover + Emergency Stop

- إضافة Human Takeover لرصد pointer/keyboard/scroll/selection/touch وإيقاف Actor tools عند تدخل المستخدم.
- التمييز بين إدخال المستخدم وإدخال Brauzio عبر Agent Activity suppression windows بدل الاعتماد على `isTrusted` وحده.
- تحرير أي Mouse Hold عالق فور takeover أو Emergency Stop.
- حفظ حالة pause محليًا ومزامنتها مع Durable Object؛ Cloudflare يرفض Actor calls أثناء الإيقاف مع حالة `423`.
- إبقاء أدوات القراءة والمراقبة متاحة أثناء Human Takeover للتشخيص الآمن.
- إضافة أزرار Emergency Stop واستئناف تحكم ChatGPT إلى Popup، مع Badge `STOP` على أيقونة الإضافة.
- إصلاح توافق JSON Schema بين `brauzio-shared` وMCP Server 2.0 بتوحيد base/watch schemas على نوع JSON-safe واحد.
- إصلاح حالتي TypeScript في Action Verification: إغلاق التبويب أثناء navigation ونوع `Tab.status`.
- تم التحقق في CI التشخيصي من shared build وCloud check/dry-run وextension compile/build بنجاح قبل الإصدار.
"""
          if 'Extension V2.6.0 Human Takeover + Emergency Stop' not in c:
              c = c.replace(heading, heading + entry, 1)
          changelog.write_text(c, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          replacements = {
            '- [ ] مراقبة pointer/click/keyboard/scroll/selection.': '- [x] مراقبة pointer/click/keyboard/scroll/selection/touch.',
            '- [ ] تمييز Human input عن Agent-generated input بدون الاعتماد على `isTrusted` وحده.': '- [x] تمييز Human input عن Agent-generated input عبر Agent Activity suppression windows بدون الاعتماد على `isTrusted` وحده.',
            '- [ ] زر Emergency Stop.': '- [x] زر Emergency Stop مع تحرير input الممسوك ومزامنة pause إلى Cloudflare.',
            '- [ ] زر "استئناف تحكم ChatGPT".': '- [x] زر "استئناف تحكم ChatGPT" مع بقاء pause محفوظًا عبر Service Worker restarts.',
            '| 7 | Human Takeover + Emergency Stop | P1 | لاحقًا |': '| 7 | Human Takeover + Emergency Stop | P1 | Foundation مكتملة ومبنية في 2.6.0، E2E على النسخة المثبتة متبقٍ |',
          }
          for old, new in replacements.items():
              if old in r:
                  r = r.replace(old, new, 1)
          roadmap.write_text(r, encoding='utf-8')
          PY

      - name: Validate shared and Cloud runtime
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build

      - name: Commit prepared metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cloudflare-mcp/src/index.ts docs/CHANGELOG.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Prepare Brauzio 2.6 runtime metadata and docs [skip ci]'
          git push
