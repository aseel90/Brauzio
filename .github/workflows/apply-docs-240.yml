name: Apply Brauzio 2.4 Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-docs-240.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply docs update
        run: |
          set -euo pipefail
          python scripts/.brauzio-docs-240.py
          git diff --check
      - name: Commit docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update roadmap and changelog through Brauzio 2.4.0'
          git push
