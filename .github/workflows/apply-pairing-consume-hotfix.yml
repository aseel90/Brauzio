name: Apply Brauzio pairing consume hotfix

on:
  push:
    branches:
      - fix/3.1.2-pairing-consume-v2
    paths:
      - .github/workflows/apply-pairing-consume-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.2-pairing-consume-v2
          fetch-depth: 0

      - name: Apply OAuth pairing endpoint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('app/cloudflare-mcp/src/index.ts')
          worker = worker_path.read_text(encoding='utf-8')

          required = [
              "const BRAUZIO_RUNTIME_VERSION = '3.1.1';",
              "const BRAUZIO_SCHEMA_VERSION = '3.1.1';",
              "https://brauzio-browser.internal/pairing/confirm",
              "if (!pairing.ok || pairingResult.ok !== true || pairingResult.active !== true) {",
          ]
          for needle in required:
              assert needle in worker, f'missing expected worker text: {needle}'

          worker = worker.replace("const BRAUZIO_RUNTIME_VERSION = '3.1.1';", "const BRAUZIO_RUNTIME_VERSION = '3.1.2';")
          worker = worker.replace("const BRAUZIO_SCHEMA_VERSION = '3.1.1';", "const BRAUZIO_SCHEMA_VERSION = '3.1.2';")
          worker = worker.replace('https://brauzio-browser.internal/pairing/confirm', 'https://brauzio-browser.internal/pairing/consume')
          worker = worker.replace(
              'if (!pairing.ok || pairingResult.ok !== true || pairingResult.active !== true) {',
              'if (!pairing.ok || pairingResult.ok !== true) {'
          )
          worker = worker.replace(
              "  const pairingResult = (await pairing.json().catch(() => ({}))) as {\n    ok?: boolean;\n    active?: boolean;\n    error?: string;\n  };",
              "  const pairingResult = (await pairing.json().catch(() => ({}))) as {\n    ok?: boolean;\n    error?: string;\n    code?: string;\n  };"
          )
          assert 'pairing/confirm' not in worker
          assert 'pairing/consume' in worker
          assert 'pairingResult.active' not in worker
          worker_path.write_text(worker, encoding='utf-8')

          ci_path = Path('.github/workflows/brauzio-ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          if "SESSION_BASE='app/cloudflare-mcp/src/browser-session.ts'" not in ci:
              ci = ci.replace(
                  "          SESSION='app/cloudflare-mcp/src/browser-session-v31.ts'\n",
                  "          SESSION='app/cloudflare-mcp/src/browser-session-v31.ts'\n          SESSION_BASE='app/cloudflare-mcp/src/browser-session.ts'\n"
              )
          anchor = "          grep -Fq '__brauzioRequestId' \"$WORKER\"\n"
          guards = """          grep -Fq '__brauzioRequestId' "$WORKER"
          grep -Fq "https://brauzio-browser.internal/pairing/consume" "$WORKER"
          if grep -Fq "pairing/confirm" "$WORKER"; then
            echo 'OAuth pairing endpoint must use /pairing/consume.' >&2
            exit 1
          fi
          grep -Fq "if (!pairing.ok || pairingResult.ok !== true)" "$WORKER"
          grep -Fq "url.pathname === '/pairing/consume'" "$SESSION_BASE"
"""
          if 'OAuth pairing endpoint must use /pairing/consume.' not in ci:
              assert anchor in ci
              ci = ci.replace(anchor, guards)
          ci = ci.replace(
              '# Runtime hardening gate: Brauzio 3.1.1 server / 3.1.2 extension',
              '# Runtime hardening gate: Brauzio 3.1.2 server / 3.1.2 extension'
          )
          ci_path.write_text(ci, encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cloudflare-mcp/src/index.ts .github/workflows/brauzio-ci.yml
          git commit -m "Brauzio 3.1.2: fix pairing code consumption"
          git push
