name: Apply Brauzio 3.1.2 Pairing Hotfix

on:
  push:
    branches:
      - fix/3.1.2-pairing-create
    paths:
      - '.github/workflows/apply-pairing-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.2-pairing-create
      - name: Apply hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          relay = Path('app/chrome-extension/entrypoints/background/remote-relay.ts')
          s = relay.read_text()
          needle = """    if (message.type === 'brauzio_pairing_get') {\n      sendResponse({ success: true, pairing: currentPairing });\n      return false;\n    }\n\n"""
          insert = needle + """    if (message.type === 'brauzio_pairing_create') {\n      if (!socket || socket.readyState !== WebSocket.OPEN || !currentStatus.authenticated) {\n        sendResponse({ success: false, error: 'Brauzio Cloud is not connected and authenticated' });\n        return false;\n      }\n      currentPairing = null;\n      try {\n        socket.send(JSON.stringify({ type: 'pairing_create' }));\n        relayLog('PAIRING_CREATE_REQUESTED');\n        sendResponse({ success: true });\n      } catch (error) {\n        const messageText = error instanceof Error ? error.message : String(error);\n        relayLog('PAIRING_CREATE_SEND_FAILED', { error: messageText });\n        sendResponse({ success: false, error: messageText });\n      }\n      return false;\n    }\n\n"""
          if "message.type === 'brauzio_pairing_create'" not in s:
              if needle not in s:
                  raise SystemExit('pairing_get block not found')
              s = s.replace(needle, insert, 1)
          relay.write_text(s)

          popup = Path('app/chrome-extension/entrypoints/popup/App.vue')
          s = popup.read_text()
          if "const pairingError = ref('');" not in s:
              s = s.replace("const pairingBusy = ref(false);\n", "const pairingBusy = ref(false);\nconst pairingError = ref('');\n", 1)
          old = "async function createPairingCode() { if (!isConnected.value || pairingBusy.value) return; pairingBusy.value = true; pairing.value = null; try { await chrome.runtime.sendMessage({ type: 'brauzio_pairing_create' }); } finally { pairingBusy.value = false; } }"
          new = "async function createPairingCode() { if (!isConnected.value || pairingBusy.value) return; pairingBusy.value = true; pairing.value = null; pairingError.value = ''; try { const response = await chrome.runtime.sendMessage({ type: 'brauzio_pairing_create' }); if (!response?.success) throw new Error(response?.error || 'تعذر إنشاء رمز الربط'); } catch (error) { pairingError.value = error instanceof Error ? error.message : String(error); } finally { pairingBusy.value = false; } }"
          if old in s:
              s = s.replace(old, new, 1)
          old_listener = "const runtimeListener = (message: any) => { if (message?.type === 'brauzio_relay_status_changed' && message.status) applyStatus(message.status); if (message?.type === 'brauzio_pairing_code_changed') pairing.value = message.pairing || null; if (message?.type === 'brauzio_control_state_changed' && message.state) Object.assign(control, message.state); };"
          new_listener = "const runtimeListener = (message: any) => { if (message?.type === 'brauzio_relay_status_changed' && message.status) applyStatus(message.status); if (message?.type === 'brauzio_pairing_code_changed') { pairing.value = message.pairing || null; pairingError.value = ''; } if (message?.type === 'brauzio_control_state_changed' && message.state) Object.assign(control, message.state); };"
          if old_listener in s:
              s = s.replace(old_listener, new_listener, 1)
          marker = "<button class=\"button quiet full\" :disabled=\"!isConnected || pairingBusy\" @click=\"createPairingCode\">{{ pairingBusy ? 'جارٍ الإنشاء…' : 'إنشاء رمز الربط' }}</button><div v-if=\"pairing\" class=\"pairing-code\">"
          replacement = "<button class=\"button quiet full\" :disabled=\"!isConnected || pairingBusy\" @click=\"createPairingCode\">{{ pairingBusy ? 'جارٍ الإنشاء…' : 'إنشاء رمز الربط' }}</button><p v-if=\"pairingError\" class=\"inline-error\">{{ pairingError }}</p><div v-if=\"pairing\" class=\"pairing-code\">"
          if marker in s:
              s = s.replace(marker, replacement, 1)
          popup.write_text(s)

          package = Path('app/chrome-extension/package.json')
          s = package.read_text().replace('"version": "3.1.1"', '"version": "3.1.2"', 1)
          package.write_text(s)

          window = Path('app/chrome-extension/entrypoints/background/tools/browser/window.ts')
          s = window.read_text().replace('BRAUZIO_BUILD_3_1_1', 'BRAUZIO_BUILD_3_1_2')
          window.write_text(s)

          ci = Path('.github/workflows/brauzio-ci.yml')
          s = ci.read_text()
          if "message.type === 'brauzio_pairing_create'" not in s:
              key = "          grep -Fq 'relayMetrics.reconnectScheduled' \"$RELAY\"\n"
              s = s.replace(key, key + "          grep -Fq \"message.type === 'brauzio_pairing_create'\" \"$RELAY\"\n          grep -Fq \"socket.send(JSON.stringify({ type: 'pairing_create' }))\" \"$RELAY\"\n", 1)
          s = s.replace("assert manifest.get('version') == '3.1.1'", "assert manifest.get('version') == '3.1.2'", 1)
          s = s.replace("BRAUZIO_BUILD_3_1_1", "BRAUZIO_BUILD_3_1_2")
          s = s.replace('Brauzio 3.1.1 + promise-safe Live View + Defender-safe static Welcome.', 'Brauzio 3.1.2 + pairing-create bridge + promise-safe Live View + Defender-safe static Welcome.')
          s = s.replace('# Extension hotfix: Brauzio 3.1.1', '# Extension hotfix: Brauzio 3.1.2')
          s = s.replace('# Runtime hardening gate: Brauzio 3.1.0 server / 3.1.1 extension', '# Runtime hardening gate: Brauzio 3.1.1 server / 3.1.2 extension')
          s = s.replace('# Final validation trigger: 3.1.1 login + Defender compatibility', '# Final validation trigger: 3.1.2 pairing + login + Defender compatibility')
          ci.write_text(s)
          PY
          rm -f .github/workflows/apply-pairing-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Brauzio 3.1.2: restore pairing-code creation bridge'
          git push origin HEAD:fix/3.1.2-pairing-create
