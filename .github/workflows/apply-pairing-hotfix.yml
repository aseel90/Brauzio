name: Apply Pairing Hotfix

on:
  push:
    branches:
      - fix/pairing-reconnect-resilience

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pairing-reconnect-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Apply pairing reliability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/cloudflare-mcp/src/browser-session.ts')
          s = p.read_text(encoding='utf-8')
          old = """    if (url.pathname === '/pairing/consume' && request.method === 'POST') {
                if (this.authenticatedSockets().length === 0) {
                  return Response.json({ error: 'Brauzio extension is not connected' }, { status: 409 });
                }

                const body = (await request.json().catch(() => ({}))) as { code?: string };
                const suppliedHash = await pairingCodeHash(body.code);
                const record = await this.ctx.storage.get<PairingRecord>(PAIRING_STORAGE_KEY);
                const expired = Boolean(record && record.expiresAt <= Date.now());
                const matched = Boolean(record && !expired && constantTimeEqual(suppliedHash, record.codeHash));

                if (!record || expired || !matched) {
                  if (record) {
                    const attempts = record.attempts + 1;
                    if (expired || attempts >= PAIRING_MAX_ATTEMPTS) {
                      await this.ctx.storage.delete(PAIRING_STORAGE_KEY);
                    } else {
                      await this.ctx.storage.put(PAIRING_STORAGE_KEY, { ...record, attempts });
                    }
                  }
                  sessionLog('PAIRING_REJECTED');
                  return Response.json({ error: 'Invalid or expired pairing code' }, { status: 401 });
                }

                await this.ctx.storage.delete(PAIRING_STORAGE_KEY);
                sessionLog('PAIRING_CONSUMED', { expiresAt: record.expiresAt });
                return Response.json({ ok: true });
              }
          """
          new = """    if (url.pathname === '/pairing/consume' && request.method === 'POST') {
                const body = (await request.json().catch(() => ({}))) as { code?: string };
                const suppliedHash = await pairingCodeHash(body.code);
                const record = await this.ctx.storage.get<PairingRecord>(PAIRING_STORAGE_KEY);
                const connectedSockets = this.authenticatedSockets().length;

                // A pairing code is proof that the user approved from the authenticated extension.
                // Do not invalidate it just because the MV3 WebSocket reconnects between creation
                // and OAuth form submission. It remains one-time, short-lived and rate-limited.
                if (!record) {
                  sessionLog('PAIRING_REJECTED', { reason: 'not_found', connectedSockets });
                  return Response.json({ error: 'No active pairing code', code: 'PAIRING_NOT_FOUND' }, { status: 404 });
                }

                if (record.expiresAt <= Date.now()) {
                  await this.ctx.storage.delete(PAIRING_STORAGE_KEY);
                  sessionLog('PAIRING_REJECTED', { reason: 'expired', expiresAt: record.expiresAt, connectedSockets });
                  return Response.json({ error: 'Pairing code expired', code: 'PAIRING_EXPIRED' }, { status: 410 });
                }

                if (!constantTimeEqual(suppliedHash, record.codeHash)) {
                  const attempts = record.attempts + 1;
                  if (attempts >= PAIRING_MAX_ATTEMPTS) {
                    await this.ctx.storage.delete(PAIRING_STORAGE_KEY);
                    sessionLog('PAIRING_REJECTED', { reason: 'attempts_exceeded', attempts, connectedSockets });
                    return Response.json({ error: 'Pairing attempts exceeded', code: 'PAIRING_ATTEMPTS_EXCEEDED' }, { status: 429 });
                  }
                  await this.ctx.storage.put(PAIRING_STORAGE_KEY, { ...record, attempts });
                  sessionLog('PAIRING_REJECTED', { reason: 'mismatch', attempts, connectedSockets });
                  return Response.json({ error: 'Pairing code mismatch', code: 'PAIRING_MISMATCH' }, { status: 401 });
                }

                await this.ctx.storage.delete(PAIRING_STORAGE_KEY);
                sessionLog('PAIRING_CONSUMED', { expiresAt: record.expiresAt, connectedSockets });
                return Response.json({ ok: true });
              }
          """
          if old not in s:
              raise SystemExit('browser-session pairing block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('app/cloudflare-mcp/src/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const BRAUZIO_RUNTIME_VERSION = '2.1.0';", "const BRAUZIO_RUNTIME_VERSION = '2.1.1';")
          s = s.replace("const BRAUZIO_SCHEMA_VERSION = 'v2.1-2026-09-06';", "const BRAUZIO_SCHEMA_VERSION = 'v2.1.1-2026-09-06';")
          old = """async function consumePairingCode(env: Env, deviceId: string, code: string): Promise<boolean> {
            const response = await browserStub(env, deviceId).fetch(
              new Request('https://brauzio-browser.internal/pairing/consume', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ code }),
              }),
            );
            return response.ok;
          }
          """
          new = """type PairingConsumeFailure =
            | 'missing'
            | 'not_found'
            | 'expired'
            | 'mismatch'
            | 'attempts_exceeded'
            | 'server_error';

          type PairingConsumeResult = { ok: true } | { ok: false; reason: PairingConsumeFailure };

          async function consumePairingCode(env: Env, deviceId: string, code: string): Promise<PairingConsumeResult> {
            try {
              const response = await browserStub(env, deviceId).fetch(
                new Request('https://brauzio-browser.internal/pairing/consume', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ code }),
                }),
              );
              if (response.ok) return { ok: true };
              const payload = (await response.json().catch(() => ({}))) as { code?: string };
              const reason: PairingConsumeFailure =
                payload.code === 'PAIRING_NOT_FOUND' ? 'not_found'
                  : payload.code === 'PAIRING_EXPIRED' ? 'expired'
                    : payload.code === 'PAIRING_MISMATCH' ? 'mismatch'
                      : payload.code === 'PAIRING_ATTEMPTS_EXCEEDED' ? 'attempts_exceeded'
                        : 'server_error';
              return { ok: false, reason };
            } catch (error) {
              workerLog('PAIRING_CONSUME_FAILED', { deviceId, error: error instanceof Error ? error.message : String(error) });
              return { ok: false, reason: 'server_error' };
            }
          }

          function pairingErrorMessage(reason: PairingConsumeFailure): string {
            switch (reason) {
              case 'missing': return 'أدخل رمز الربط الذي ظهر في إضافة Brauzio.';
              case 'not_found': return 'لا يوجد رمز ربط نشط لهذا الجهاز. أنشئ رمزًا جديدًا من إضافة Brauzio ثم حاول مرة أخرى.';
              case 'expired': return 'انتهت صلاحية رمز الربط. أنشئ رمزًا جديدًا من إضافة Brauzio.';
              case 'mismatch': return 'رمز الربط لا يطابق آخر رمز تم إنشاؤه لهذا الجهاز. انسخ أحدث رمز ظاهر في إضافة Brauzio.';
              case 'attempts_exceeded': return 'تم تجاوز عدد محاولات رمز الربط. أنشئ رمزًا جديدًا من إضافة Brauzio.';
              default: return 'تعذر التحقق من رمز الربط بسبب خطأ في Brauzio Cloud. حاول إنشاء رمز جديد ثم أعد المحاولة.';
            }
          }
          """
          if old not in s:
              raise SystemExit('index pairing helper not found')
          s = s.replace(old, new)
          old = """  if (!pairingCode || !(await consumePairingCode(env, deviceId, pairingCode))) {
              workerLog('OAUTH_PAIRING_REJECTED', { deviceId, clientId: oauthRequest.clientId });
              return authorizationPage({
                requestUrl: request.url,
                clientName,
                defaultDeviceId: deviceId,
                error: 'رمز الربط غير صحيح أو انتهت صلاحيته. أنشئ رمزًا جديدًا من إضافة Brauzio.',
              });
            }
          """
          new = """  const pairingResult: PairingConsumeResult = pairingCode
              ? await consumePairingCode(env, deviceId, pairingCode)
              : { ok: false, reason: 'missing' };

            if (!pairingResult.ok) {
              workerLog('OAUTH_PAIRING_REJECTED', { deviceId, clientId: oauthRequest.clientId, reason: pairingResult.reason });
              return authorizationPage({
                requestUrl: request.url,
                clientName,
                defaultDeviceId: deviceId,
                error: pairingErrorMessage(pairingResult.reason),
              });
            }
          """
          if old not in s:
              raise SystemExit('authorize pairing block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/TROUBLESHOOTING.md')
          s = p.read_text(encoding='utf-8')
          old = """إذا ظهرت صفحة التفويض ولم يقبل الرمز:

          1. تأكد أن الإضافة متصلة بـCloudflare.
          2. أنشئ Pairing Code جديدًا من Popup.
          3. استخدمه خلال خمس دقائق.
          4. كل رمز يستخدم مرة واحدة فقط؛ إذا فشل أو استُخدم أنشئ رمزًا جديدًا.
          """
          new = """إذا ظهرت صفحة التفويض ولم يقبل الرمز:

          1. أنشئ Pairing Code جديدًا من Popup.
          2. استخدم أحدث رمز ظاهر خلال خمس دقائق.
          3. كل رمز يستخدم مرة واحدة فقط.
          4. منذ Brauzio Cloud 2.1.1 لا يؤدي انقطاع WebSocket أو إعادة اتصال الإضافة لحظيًا إلى إبطال رمز تم إنشاؤه بالفعل.
          5. صفحة التفويض تعرض سبب الرفض بدقة: لا يوجد رمز نشط، منتهي، غير مطابق، تجاوز المحاولات، أو خطأ Cloud.

          ملاحظة أمان: رمز الربط يبقى قصير العمر، يستخدم مرة واحدة، يخزن كـSHA-256 فقط، ومحدد بعدد محاولات حتى مع السماح بإكمال OAuth أثناء إعادة اتصال الإضافة.
          """
          if old not in s:
              raise SystemExit('troubleshooting pairing block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '# Brauzio Changelog\n\n'
          entry = """## 2026-09-06 — V2.1.1 Pairing Reliability

          - يبقى Pairing Code صالحًا طوال مدة الخمس دقائق حتى إذا أعادت الإضافة اتصال WebSocket بعد إنشاء الرمز.
          - صفحة OAuth تعرض سبب الرفض الحقيقي بدل رسالة عامة: لا يوجد رمز نشط، منتهي، غير مطابق، تجاوز المحاولات، أو خطأ Cloud.
          - الإبقاء على خصائص الأمان: استخدام مرة واحدة، SHA-256 فقط في التخزين، وحد أقصى عشر محاولات فاشلة.
          - إضافة reason codes غير سرية إلى logs لتشخيص مشاكل الربط دون تسجيل الرمز نفسه.
          - رفع Cloud runtime إلى `2.1.1`؛ لا يحتاج هذا الإصلاح إلى إعادة تثبيت الإضافة `2.1.0`.

          """
          if entry not in s:
              if marker not in s:
                  raise SystemExit('changelog marker missing')
              s = s.replace(marker, marker + entry, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Dry-run Cloud build
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Commit verified hotfix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-pairing-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cloudflare-mcp/src/browser-session.ts app/cloudflare-mcp/src/index.ts docs/TROUBLESHOOTING.md docs/CHANGELOG.md .github/workflows/apply-pairing-hotfix.yml
          git commit -m "fix: keep pairing valid across relay reconnects"
          git push origin HEAD:fix/pairing-reconnect-resilience
