name: Apply Brauzio Runtime 2.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-240.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime version
        run: |
          set -euo pipefail
          python scripts/.brauzio-runtime-240.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build
      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check
      - name: Commit validated runtime version
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cloudflare-mcp/src/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Set Brauzio Cloud runtime to 2.4.0'
          git push
