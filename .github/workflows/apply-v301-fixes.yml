name: Apply Brauzio 3.0.1 fixes

on:
  push:
    branches: [brauzio-v3-runtime]
    paths:
      - scripts/apply-v301-fixes.py
      - .github/workflows/apply-v301-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brauzio-v3-runtime
          fetch-depth: 0
      - name: Fetch dashboard from main
        run: git fetch origin main
      - name: Apply reviewed 3.0.1 core fixes
        run: python scripts/apply-v301-fixes.py
      - name: Port redesigned dashboard and Live View controls
        run: |
          git show origin/main:app/chrome-extension/entrypoints/popup/App.vue > app/chrome-extension/entrypoints/popup/App.vue
          git show origin/main:app/chrome-extension/entrypoints/popup/style.css > app/chrome-extension/entrypoints/popup/style.css
          git show origin/main:app/chrome-extension/entrypoints/background/index.ts > app/chrome-extension/entrypoints/background/index.ts
          git show origin/main:app/chrome-extension/entrypoints/background/popup-live-view.ts > app/chrome-extension/entrypoints/background/popup-live-view.ts
      - name: Remove temporary patch runner and commit final files
        run: |
          git rm scripts/apply-v301-fixes.py .github/workflows/apply-v301-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(v3): Brauzio 3.0.1 reliability and native image delivery"
          git push origin HEAD:brauzio-v3-runtime
