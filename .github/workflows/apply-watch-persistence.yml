name: Apply Brauzio Smart Wait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-persistence.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Smart Wait wiring
        shell: bash
        run: |
          set -euo pipefail
          python scripts/.brauzio-smartwait.py
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare extension types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build extension
        run: pnpm --filter brauzio-extension build

      - name: Commit validated Smart Wait wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/chrome-extension/entrypoints/background/tools/browser/computer.ts \
            packages/shared/src/tools.ts
          if git diff --cached --quiet; then
            echo 'Smart Wait wiring already applied.'
            exit 0
          fi
          git commit -m 'Wire Smart Wait into chrome_computer'
          git push
