name: Apply Brauzio 2.3.0 Release Metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-persistence.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/.brauzio-release-230.py
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare extension types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build extension
        run: pnpm --filter brauzio-extension build

      - name: Commit validated release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cloudflare-mcp/src/index.ts docs/ROADMAP.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Release metadata already applied.'
            exit 0
          fi
          git commit -m 'Document and version Brauzio 2.3.0 runtime'
          git push
