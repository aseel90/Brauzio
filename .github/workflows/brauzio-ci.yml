name: Brauzio CI

on:
  push:
    paths:
      - '.github/workflows/brauzio-ci.yml'
      - 'app/cloudflare-mcp/**'
      - 'app/chrome-extension/**'
      - 'packages/shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy local bridge references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.map' \
            '127\.0\.0\.1|localhost|nativeServerPort|NATIVE_HOST|NATIVE_SERVER_PORT|NativeMessageType|connectNative|ENSURE_NATIVE|mcp-chrome-bridge' \
            app/chrome-extension; then
            echo 'Legacy localhost/native bridge references remain in the Brauzio extension.' >&2
            exit 1
          fi
          echo 'Brauzio extension is cloud-only: no localhost/native bridge references found.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies without legacy lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT extension types
        run: pnpm --filter chrome-mcp-server exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter chrome-mcp-shared build

      - name: Typecheck Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Build Chrome extension
        run: pnpm --filter chrome-mcp-server build

      - name: Package Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../brauzio-chrome.zip .

      - name: Show generated package
        shell: bash
        run: |
          ls -lh app/chrome-extension/.output/brauzio-chrome.zip
          unzip -t app/chrome-extension/.output/brauzio-chrome.zip >/dev/null

      - name: Upload installable Brauzio ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Brauzio-Chrome-Extension
          path: app/chrome-extension/.output/brauzio-chrome.zip
          if-no-files-found: error
          retention-days: 30
