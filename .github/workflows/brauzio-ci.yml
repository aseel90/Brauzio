name: Brauzio CI

on:
  push:
    paths:
      - '.github/workflows/brauzio-ci.yml'
      - 'app/cloudflare-mcp/**'
      - 'app/chrome-extension/**'
      - 'packages/shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies without legacy lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT extension types
        run: pnpm --filter chrome-mcp-server exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter chrome-mcp-shared build

      - name: Typecheck Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Dry-build Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Build Chrome extension
        run: pnpm --filter chrome-mcp-server build
