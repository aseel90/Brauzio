name: Brauzio CI

on:
  push:
    paths:
      - '.github/workflows/brauzio-ci.yml'
      - 'app/cloudflare-mcp/**'
      - 'app/chrome-extension/**'
      - 'packages/shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: brauzio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy local bridge references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.map' \
            '127\.0\.0\.1|localhost|12306|Default Popup Title|Native Server|native server|nativeServerPort|NATIVE_HOST|NATIVE_SERVER_PORT|NativeMessageType|connectNative|ENSURE_NATIVE|mcp-chrome-bridge' \
            app/chrome-extension; then
            echo 'Legacy local/native/branding references remain in the Brauzio extension.' >&2
            exit 1
          fi
          echo 'Brauzio extension is cloud-only and clean of legacy bridge branding.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies without legacy lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT extension types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Runtime regression guards
        shell: bash
        run: |
          set -euo pipefail
          JS='app/chrome-extension/entrypoints/background/tools/browser/javascript.ts'
          ACT='app/chrome-extension/entrypoints/background/runtime-v3/action-engine.ts'
          grep -Fq 'buildExecutionSource(code)' "$JS"
          grep -Fq 'functionBody = `return (${userCode});`' "$JS"
          grep -Fq 'isNativeHtml5Draggable' "$ACT"
          grep -Fq 'const steps = 4;' "$ACT"
          echo 'Runtime regression guards passed: JS result propagation + HTML5 drag fast path.'

      - name: Build Chrome extension
        run: pnpm --filter brauzio-extension build

      - name: Package Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../brauzio-chrome.zip .

      - name: Verify packaged extension
        shell: bash
        run: |
          set -euo pipefail
          ZIP=app/chrome-extension/.output/brauzio-chrome.zip
          ls -lh "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q "$ZIP" -d "$TMP_DIR"
          python - "$TMP_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          assert manifest.get('default_locale') == 'ar', manifest.get('default_locale')
          assert manifest.get('action', {}).get('default_title') == 'Brauzio', manifest.get('action')
          assert (root / '_locales' / 'ar' / 'messages.json').is_file(), 'Arabic locale missing'
          assert not (root / '_locales' / 'zh_CN').exists(), 'zh_CN unexpectedly present'
          assert not (root / '_locales' / 'zh_TW').exists(), 'zh_TW unexpectedly present'
          assert manifest.get('icons', {}).get('128') == 'icon/128.png', manifest.get('icons')
          assert not (root / 'wxt.svg').exists(), 'WXT scaffold asset unexpectedly present'

          print('Packaged manifest verified: Brauzio identity, Arabic locale, custom icons, no Chinese locales.')
          PY

      - name: Upload installable Brauzio ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Brauzio-Chrome-Extension
          path: app/chrome-extension/.output/brauzio-chrome.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable latest ZIP
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='releases/chrome-extension/latest'
          DEST_ZIP="$DEST_DIR/brauzio-chrome-latest.zip"
          mkdir -p "$DEST_DIR"
          rm -f "$DEST_DIR/chrome-mcp-server-lastest.zip"
          cp app/chrome-extension/.output/brauzio-chrome.zip "$DEST_ZIP"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST_DIR"

          if git diff --cached --quiet; then
            echo 'Published ZIP is already current.'
            exit 0
          fi

          git commit -m 'build: publish latest Brauzio Chrome extension [skip ci]'
          git push

# Current release line: Brauzio 3.0.x
# Runtime hardening gate: Brauzio 3.0.5
