name: Brauzio CI

on:
  push:
    branches: [main]
    paths:
      - 'app/chrome-extension/**'
      - 'app/cloudflare-mcp/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/brauzio-ci.yml'
  pull_request:
    paths:
      - 'app/chrome-extension/**'
      - 'app/cloudflare-mcp/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/brauzio-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter brauzio-shared typecheck

      - name: Typecheck Cloudflare MCP
        run: pnpm --filter brauzio-cloudflare-mcp typecheck

      - name: Verify Brauzio 3.1 reliability contract
        shell: bash
        run: |
          set -euo pipefail
          SMART='app/chrome-extension/entrypoints/background/tools/browser/smart-wait.ts'
          V3='app/chrome-extension/entrypoints/background/tools/browser/v3-runtime.ts'
          REGISTRY='app/chrome-extension/entrypoints/background/runtime-v3/element-registry.ts'
          TRACE='app/chrome-extension/entrypoints/background/runtime-v3/tool-trace.ts'
          AUTO='app/chrome-extension/entrypoints/background/runtime-v3/automation-session.ts'
          CACHE='app/chrome-extension/entrypoints/background/relay-tool-cache.ts'
          RELAY='app/chrome-extension/entrypoints/background/remote-relay.ts'
          LIVE='app/chrome-extension/entrypoints/background/tools/browser/live-view.ts'
          WELCOME_DIR='app/chrome-extension/entrypoints/welcome'
          DEVICE='app/chrome-extension/entrypoints/background/tools/browser/device-mode.ts'
          DIAG='app/chrome-extension/entrypoints/background/tools/browser/diagnostics.ts'
          WORKER='app/cloudflare-mcp/src/index.ts'
          SESSION='app/cloudflare-mcp/src/browser-session-v31.ts'
          SESSION_BASE='app/cloudflare-mcp/src/browser-session.ts'

          grep -Fq 'MutationObserver' "$SMART"
          grep -Fq 'retryReasons' "$V3"
          grep -Fq 'stale' "$REGISTRY"
          grep -Fq 'toolTrace' "$TRACE"
          grep -Fq 'chrome.storage.session' "$AUTO"
          grep -Fq 'chrome.storage.session' "$CACHE"
          grep -Fq 'RECONNECT_JITTER_RATIO' "$RELAY"
          grep -Fq 'relayMetrics.reconnectScheduled' "$RELAY"
          grep -Fq "message.type === 'brauzio_pairing_create'" "$RELAY"
          grep -Fq "socket.send(JSON.stringify({ type: 'pairing_create' }))" "$RELAY"
          grep -Fq 'export async function stopAllLiveViews' "$LIVE"
          grep -Fq 'Promise<number>' "$LIVE"
          test ! -e "$WELCOME_DIR/main.ts"
          test ! -e "$WELCOME_DIR/App.vue"
          if grep -RInE '<script|chrome\.|navigator\.clipboard|localStorage|sessionStorage|eval\(|new Function' "$WELCOME_DIR"; then
            echo 'Welcome source must remain static HTML/CSS only.' >&2
            exit 1
          fi
          grep -Fq 'Emulation.setUserAgentOverride' "$DEVICE"
          grep -Fq "name = 'chrome_diagnostics'" "$DIAG"
          grep -Fq 'BRAUZIO_DIAGNOSTICS_SCHEMA' "$WORKER"
          grep -Fq '__brauzioRequestId' "$WORKER"
          grep -Fq "https://brauzio-browser.internal/pairing/consume" "$WORKER"
          if grep -Fq "pairing/confirm" "$WORKER"; then
            echo 'OAuth pairing endpoint must use /pairing/consume, not /pairing/confirm.' >&2
            exit 1
          fi
          grep -Fq "if (!pairing.ok || pairingResult.ok !== true)" "$WORKER"
          grep -Fq "const BRAUZIO_RUNTIME_VERSION = '3.1.3'" "$WORKER"
          grep -Fq "const BRAUZIO_SCHEMA_VERSION = '3.1.3'" "$WORKER"
          grep -Fq "tokenEndpoint: '/oauth/token'" "$WORKER"
          grep -Fq "clientRegistrationEndpoint: '/oauth/register'" "$WORKER"
          grep -Fq "scopesSupported: [BRAUZIO_SCOPE]" "$WORKER"
          grep -Fq 'allowPlainPKCE: false' "$WORKER"
          grep -Fq 'clientIdMetadataDocumentEnabled: true' "$WORKER"
          grep -Fq 'resourceMetadata: {' "$WORKER"
          grep -Fq 'authorization_servers: [BRAUZIO_ORIGIN]' "$WORKER"
          grep -Fq "url.pathname === '/browser-pairing'" "$WORKER"
          grep -Fq "url.pathname === '/browser-status'" "$WORKER"
          if grep -Fq "tokenEndpoint: '/token'" "$WORKER"; then
            echo 'ChatGPT OAuth token endpoint regressed to /token; must remain /oauth/token.' >&2
            exit 1
          fi
          grep -Fq "url.pathname === '/pairing/consume'" "$SESSION_BASE"
          grep -Fq 'export class BrowserSession extends BrowserSessionBase' "$SESSION"
          grep -Fq 'CALL_RESENT_AFTER_RECONNECT' "$SESSION"

          echo 'Brauzio 3.1 reliability contract passed.'

      - name: Build Chrome extension
        run: pnpm --filter brauzio-extension build

      - name: Package Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../brauzio-chrome.zip .

      - name: Verify packaged extension
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re
          import zipfile

          root = pathlib.Path('app/chrome-extension/.output')
          zip_path = root / 'brauzio-chrome.zip'
          assert zip_path.exists(), zip_path

          with zipfile.ZipFile(zip_path) as zf:
              names = set(zf.namelist())
              manifest = json.loads(zf.read('manifest.json'))
              assert manifest.get('version') == '3.1.2', manifest.get('version')
              assert 'welcome.html' in names
              welcome = zf.read('welcome.html').decode('utf-8', 'replace')
              scripts = re.findall(r'<script[^>]+src="([^"]+)"', welcome)
              assert len(scripts) <= 1, scripts
              for src in scripts:
                  assert src.startswith('/chunks/'), src
                  payload = zf.read(src.lstrip('/')).decode('utf-8', 'replace')
                  assert 'welcome' not in payload.lower(), src
                  assert 'chrome.storage' not in payload, src
                  assert 'navigator.clipboard' not in payload, src
              background_file = manifest['background']['service_worker']
              background = zf.read(background_file).decode('utf-8', 'replace')
              assert 'BRAUZIO_BUILD_3_1_2' in background, '3.1.2 build marker missing from packaged background'
              assert 'brauzio_pairing_create' in background, 'pairing-create bridge missing from packaged background'
              assert 'pairing_create' in background, 'pairing-create relay event missing from packaged background'
              assert 'stopAllLiveViews' in background, 'promise-safe Live View cleanup missing from packaged background'

          print('Packaged manifest verified: Brauzio 3.1.2 + pairing-create bridge + promise-safe Live View + Defender-safe static Welcome.')
          PY

      - name: Publish latest extension ZIP on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp app/chrome-extension/.output/brauzio-chrome.zip releases/chrome-extension/latest/brauzio-chrome-latest.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/chrome-extension/latest/brauzio-chrome-latest.zip
          if git diff --cached --quiet; then
            echo 'Latest ZIP unchanged.'
            exit 0
          fi
          git commit -m 'build: publish latest Brauzio Chrome extension [skip ci]'
          git push

# Extension hotfix: Brauzio 3.1.2
# Runtime hardening gate: Brauzio 3.1.2 server / 3.1.2 extension
# Final validation trigger: 3.1.2 pairing consume + login + Defender compatibility
# CI rerun marker: pairing consume final validation

# Worker OAuth contract restore: 3.1.3 keeps ChatGPT CIMD endpoints from the last known-good 3.0.7 flow.
