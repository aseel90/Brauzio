name: Brauzio CI

on:
  push:
    paths:
      - '.github/workflows/brauzio-ci.yml'
      - 'app/cloudflare-mcp/**'
      - 'app/chrome-extension/**'
      - 'packages/shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: brauzio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy local bridge references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.map' \
            '127\.0\.0\.1|localhost|12306|Default Popup Title|Native Server|native server|nativeServerPort|NATIVE_HOST|NATIVE_SERVER_PORT|NativeMessageType|connectNative|ENSURE_NATIVE|mcp-chrome-bridge' \
            app/chrome-extension; then
            echo 'Legacy local/native/branding references remain in the Brauzio extension.' >&2
            exit 1
          fi
          echo 'Brauzio extension is cloud-only and clean of legacy bridge branding.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies without legacy lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT extension types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Runtime regression guards
        shell: bash
        run: |
          set -euo pipefail
          JS='app/chrome-extension/entrypoints/background/tools/browser/javascript.ts'
          ACT='app/chrome-extension/entrypoints/background/runtime-v3/action-engine.ts'
          grep -Fq "BRAUZIO_JS_RUNTIME_V3" "$JS"
          grep -Fq "buildRuntimeEvaluatorSource(code)" "$JS"
          grep -Fq 'isNativeHtml5Draggable' "$ACT"
          grep -Fq 'const steps = 4;' "$ACT"
          echo 'Runtime regression guards passed: page-side JS evaluator + HTML5 drag fast path.'

      - name: Brauzio 3.1 reliability contract
        shell: bash
        run: |
          set -euo pipefail
          SMART='app/chrome-extension/utils/smart-wait.ts'
          V3='app/chrome-extension/entrypoints/background/tools/browser/v3-runtime.ts'
          REGISTRY='app/chrome-extension/entrypoints/background/runtime-v3/element-registry.ts'
          TRACE='app/chrome-extension/entrypoints/background/runtime-v3/tool-trace.ts'
          AUTO='app/chrome-extension/entrypoints/background/runtime-v3/automation-session.ts'
          CACHE='app/chrome-extension/entrypoints/background/relay-tool-cache.ts'
          RELAY='app/chrome-extension/entrypoints/background/remote-relay.ts'
          LIVE='app/chrome-extension/entrypoints/background/tools/browser/live-view.ts'
          WELCOME_DIR='app/chrome-extension/entrypoints/welcome'
          DEVICE='app/chrome-extension/entrypoints/background/tools/browser/device-mode.ts'
          DIAG='app/chrome-extension/entrypoints/background/tools/browser/diagnostics.ts'
          WORKER='app/cloudflare-mcp/src/index.ts'
          SESSION='app/cloudflare-mcp/src/browser-session-v31.ts'
          SESSION_BASE='app/cloudflare-mcp/src/browser-session.ts'
          TOPO='app/chrome-extension/entrypoints/background/runtime-v3/tab-topology.ts'

          grep -Fq 'MutationObserver' "$SMART"
          grep -Fq 'retryReasons' "$V3"
          grep -Fq 'stale' "$REGISTRY"
          grep -Fq 'toolTrace' "$TRACE"
          grep -Fq 'chrome.storage.session' "$AUTO"
          grep -Fq 'chrome.storage.session' "$CACHE"
          grep -Fq 'RECONNECT_JITTER_RATIO' "$RELAY"
          grep -Fq 'relayMetrics.reconnectScheduled' "$RELAY"
          grep -Fq "message.type === 'brauzio_pairing_create'" "$RELAY"
          grep -Fq "socket.send(JSON.stringify({ type: 'pairing_create' }))" "$RELAY"
          grep -Fq 'export async function stopAllLiveViews' "$LIVE"
          grep -Fq 'Promise<number>' "$LIVE"
          test ! -e "$WELCOME_DIR/main.ts"
          test ! -e "$WELCOME_DIR/App.vue"
          if grep -RInE '<script|chrome\.|navigator\.clipboard|localStorage|sessionStorage|eval\(|new Function' "$WELCOME_DIR"; then
            echo 'Welcome source must remain static HTML/CSS only.' >&2
            exit 1
          fi
          grep -Fq 'Emulation.setUserAgentOverride' "$DEVICE"
          grep -Fq "name = 'chrome_diagnostics'" "$DIAG"
          grep -Fq 'BRAUZIO_DIAGNOSTICS_SCHEMA' "$WORKER"
          grep -Fq '__brauzioRequestId' "$WORKER"
          grep -Fq "https://brauzio-browser.internal/pairing/consume" "$WORKER"
          if grep -Fq "pairing/confirm" "$WORKER"; then
            echo 'OAuth pairing endpoint must use /pairing/consume, not /pairing/confirm.' >&2
            exit 1
          fi
          grep -Fq "if (!pairing.ok || pairingResult.ok !== true)" "$WORKER"
          grep -Fq "url.pathname === '/pairing/consume'" "$SESSION_BASE"
          grep -Fq 'export class BrowserSession extends BrowserSessionBase' "$SESSION"
          grep -Fq 'CALL_RESENT_AFTER_RECONNECT' "$SESSION"
          grep -Fq "const ACTOR_LEASE_STORAGE_KEY = 'actor-lease-v1'" "$SESSION_BASE"
          grep -Fq 'chrome.webNavigation.onCreatedNavigationTarget' "$TOPO"
          grep -Fq 'chrome.tabs.onUpdated' "$TOPO"
          grep -Fq 'chrome.openerTabId' "$TOPO"
          grep -Fq 'cdp.Page.windowOpen' "$TOPO"
          grep -Fq "const STORAGE_KEY = 'brauzio-tab-topology-v1'" "$TOPO"
          grep -Fq 'MCP_CALLER_CONTEXT' "$WORKER"

          echo 'Brauzio 3.1 reliability contract passed.'

      - name: Build Chrome extension
        run: pnpm --filter brauzio-extension build

      - name: Package Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../brauzio-chrome.zip .

      - name: Verify packaged extension
        shell: bash
        run: |
          set -euo pipefail
          ZIP=app/chrome-extension/.output/brauzio-chrome.zip
          ls -lh "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q "$ZIP" -d "$TMP_DIR"
          python - "$TMP_DIR" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          assert manifest.get('version') == '3.2.0', manifest.get('version')
          assert manifest.get('default_locale') == 'ar', manifest.get('default_locale')
          assert manifest.get('action', {}).get('default_title') == 'Brauzio', manifest.get('action')
          assert (root / '_locales' / 'ar' / 'messages.json').is_file(), 'Arabic locale missing'
          assert not (root / '_locales' / 'zh_CN').exists(), 'zh_CN unexpectedly present'
          assert not (root / '_locales' / 'zh_TW').exists(), 'zh_TW unexpectedly present'
          assert manifest.get('icons', {}).get('128') == 'icon/128.png', manifest.get('icons')
          assert not (root / 'wxt.svg').exists(), 'WXT scaffold asset unexpectedly present'

          background = (root / 'background.js').read_text(encoding='utf-8')
          assert 'BRAUZIO_JS_RUNTIME_V3' in background, 'JS runtime V3 marker missing from packaged background'
          assert 'BRAUZIO_BUILD_3_2_0_RC1' in background, '3.2.0 RC1 build marker missing from packaged background'

          welcome_path = root / 'welcome.html'
          welcome = welcome_path.read_text(encoding='utf-8')
          script_srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', welcome, flags=re.I)
          allowed_wxt = re.compile(r'/chunks/_virtual_wxt-html-plugins-[A-Za-z0-9_-]+\.js')
          for src in script_srcs:
              assert allowed_wxt.fullmatch(src), f'unexpected script in welcome.html: {src}'
              chunk = root / src.lstrip('/')
              assert chunk.is_file(), f'welcome runtime chunk missing: {src}'
              code = chunk.read_text(encoding='utf-8').lower()
              forbidden = ('chrome.', 'navigator.clipboard', 'localstorage', 'sessionstorage', 'brauziorelay', 'brauziodevice', 'eval(', 'new function')
              assert not any(token in code for token in forbidden), f'unsafe welcome runtime content in {src}'

          print('Packaged manifest verified: Brauzio 3.2.0 RC1 + passive topology + pairing-create + promise-safe Live View + Defender-safe static Welcome.')
          PY

      - name: Upload installable Brauzio ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Brauzio-Chrome-Extension
          path: app/chrome-extension/.output/brauzio-chrome.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Brauzio 3.2.0 RC1 candidate ZIP
        if: github.ref == 'refs/heads/feat/3.2-tab-graph-phase12-v2'
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='releases/chrome-extension/candidates/3.2.0-rc1'
          DEST_ZIP="$DEST_DIR/brauzio-chrome-3.2.0-rc1.zip"
          mkdir -p "$DEST_DIR"
          cp app/chrome-extension/.output/brauzio-chrome.zip "$DEST_ZIP"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST_ZIP"

          if git diff --cached --quiet; then
            echo 'Candidate ZIP is already current.'
            exit 0
          fi

          git commit -m 'build: publish Brauzio 3.2.0-rc1 candidate [skip ci]'
          git push

      - name: Publish stable latest ZIP
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='releases/chrome-extension/latest'
          DEST_ZIP="$DEST_DIR/brauzio-chrome-latest.zip"
          mkdir -p "$DEST_DIR"
          rm -f "$DEST_DIR/chrome-mcp-server-lastest.zip"
          cp app/chrome-extension/.output/brauzio-chrome.zip "$DEST_ZIP"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST_DIR"

          if git diff --cached --quiet; then
            echo 'Published ZIP is already current.'
            exit 0
          fi

          git commit -m 'build: publish latest Brauzio Chrome extension [skip ci]'
          git push

# Current release line: Brauzio 3.1.x
# Extension hotfix: Brauzio 3.1.2
# Runtime hardening gate: Brauzio 3.1.2 server / 3.1.2 extension
# Final validation trigger: 3.1.2 pairing consume + login + Defender compatibility
# CI rerun marker: pairing consume final validation

# Candidate line: Brauzio 3.2.0-rc1 passive tab topology; main remains stable until live validation.
