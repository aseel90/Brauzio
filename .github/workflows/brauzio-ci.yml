name: Brauzio CI

on:
  push:
    paths:
      - '.github/workflows/brauzio-ci.yml'
      - 'app/cloudflare-mcp/**'
      - 'app/chrome-extension/**'
      - 'packages/shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy local bridge references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=node_modules \
            --exclude-dir=.output \
            --exclude='*.map' \
            'NATIVE_HOST|NATIVE_SERVER_PORT|connectNative|ENSURE_NATIVE|127\.0\.0\.1:12306|mcp-chrome-bridge' \
            app/chrome-extension; then
            echo 'Legacy local/native bridge references remain in the Brauzio extension.' >&2
            exit 1
          fi
          echo 'No legacy local/native bridge references found.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies without legacy lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT extension types
        run: pnpm --filter chrome-mcp-server exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter chrome-mcp-shared build

      - name: Typecheck Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Brauzio Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Build Chrome extension
        run: pnpm --filter chrome-mcp-server build

      - name: Package Chrome extension ZIP
        run: pnpm --filter chrome-mcp-server zip

      - name: Show generated packages
        shell: bash
        run: find app/chrome-extension/.output -maxdepth 2 -type f -name '*.zip' -print

      - name: Upload installable Brauzio ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Brauzio-Chrome-Extension
          path: app/chrome-extension/.output/*.zip
          if-no-files-found: error
          retention-days: 30
