name: Brauzio phase 1 localization

on:
  push:
    paths:
      - '.github/workflows/brauzio-phase1.yml'
      - 'scripts/brauzio_phase1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brauzio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair bootstrap script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/brauzio_phase1.py')
          s = p.read_text(encoding='utf-8')
          broken = '''                hits.append(f"- `{rel}:{n}` — `{line.strip()[:180].replace('`', "'")}`")'''
          fixed = '''                safe = line.strip()[:180].replace("`", "'")\n                hits.append(f"- `{rel}:{n}` — `{safe}`")'''
          if broken in s:
              s = s.replace(broken, fixed)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Arabic branding and localization
        run: python scripts/brauzio_phase1.py

      - name: Validate locale and Chinese file removal
        shell: bash
        run: |
          python -m json.tool app/chrome-extension/_locales/ar/messages.json >/dev/null
          test ! -e app/chrome-extension/_locales/zh_CN
          test ! -e app/chrome-extension/_locales/zh_TW
          test ! -e README_zh.md
          grep -q "default_locale: 'ar'" app/chrome-extension/wxt.config.ts
          grep -q "default_title: 'Brauzio'" app/chrome-extension/wxt.config.ts

      - name: Commit phase 1
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No phase 1 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: Arabicize and brand extension as Brauzio"
          git push origin HEAD:main

# trigger phase 1
