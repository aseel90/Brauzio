name: Brauzio V2 One-time Cleanup

on:
  push:
    paths:
      - '.brauzio-v2-cleanup-trigger'
      - '.github/workflows/brauzio-v2-cleanup-once.yml'
  workflow_dispatch:

concurrency:
  group: brauzio-v2-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy product surfaces
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            app/chrome-extension/entrypoints/sidepanel \
            app/chrome-extension/entrypoints/web-editor-v2 \
            app/chrome-extension/entrypoints/shared \
            app/chrome-extension/entrypoints/styles \
            app/chrome-extension/entrypoints/popup/components \
            app/chrome-extension/tests/record-replay \
            app/chrome-extension/tests/record-replay-v3 \
            app/chrome-extension/tests/web-editor-v2

          git rm --ignore-unmatch \
            app/chrome-extension/tailwind.config.ts \
            packages/shared/src/agent-types.ts \
            packages/shared/src/constants.ts \
            packages/shared/src/labels.ts \
            packages/shared/src/node-spec-registry.ts \
            packages/shared/src/node-spec.ts \
            packages/shared/src/node-specs-builtin.ts \
            packages/shared/src/rr-graph.ts \
            packages/shared/src/step-types.ts \
            .brauzio-v2-cleanup-trigger

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Typecheck extension
        run: pnpm --filter brauzio-extension compile

      - name: Build extension
        run: pnpm --filter brauzio-extension build

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes remain.'
            exit 0
          fi
          git commit -m 'cleanup: finalize Brauzio V2 legacy removal [skip ci]'
          git pull --rebase origin main
          git push
