name: Verify Brauzio 3.0.4 comprehensive repair

on:
  push:
    branches: [fix/v3.0.4-from-v3]
    paths:
      - '.github/v304-build-trigger'
      - '.github/workflows/build-v304-from-v3.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.4-from-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Run complete repair and verification
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/v304.log) 2>&1
          trap 'code=$?; echo "FAILED exit=$code line=$LINENO command=$BASH_COMMAND"; exit $code' ERR

          echo 'STEP 1 fetch main'
          git fetch origin main

          echo 'STEP 2 port live-verified 3.0.3 files'
          git checkout origin/main -- \
            app/chrome-extension/entrypoints/background/index.ts \
            app/chrome-extension/entrypoints/background/popup-live-view.ts \
            app/chrome-extension/entrypoints/background/tools/browser/live-view.ts \
            app/chrome-extension/entrypoints/popup/App.vue \
            app/chrome-extension/entrypoints/popup/style.css \
            app/chrome-extension/utils/image-utils.ts \
            app/cloudflare-mcp/src/browser-session.ts

          echo 'STEP 3 apply 3.0.4 patch'
          python scripts/apply-v304-from-v3.py

          echo 'STEP 4 install dependencies'
          pnpm install --no-frozen-lockfile --ignore-scripts

          echo 'STEP 5 prepare WXT'
          pnpm --filter brauzio-extension exec wxt prepare

          echo 'STEP 6 build shared runtime'
          pnpm --filter brauzio-shared build

          echo 'STEP 7 typecheck Worker'
          pnpm --filter brauzio-cloud-mcp check

          echo 'STEP 8 dry-build Worker'
          pnpm --filter brauzio-cloud-mcp build

          echo 'STEP 9 typecheck extension'
          pnpm --filter brauzio-extension compile

          echo 'STEP 10 build extension'
          pnpm --filter brauzio-extension build

          echo 'STEP 11 verify generated runtime'
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('app/chrome-extension/.output/chrome-mv3')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest.get('version') == '3.0.4', manifest.get('version')
          perms=set(manifest.get('permissions', []))
          for p in ('clipboardRead','clipboardWrite','offscreen','debugger'):
              assert p in perms, p
          bg=(root/'background.js').read_text(errors='ignore')
          for needle in ('chrome_observe','chrome_resolve','chrome_act','chrome_clipboard','chrome_artifacts','brauzio-popup-live-view-tab-v1','dispatchHtml5Drag'):
              assert needle in bg, needle
          print('Generated Brauzio 3.0.4 verification PASS')
          PY

          echo 'STEP 12 package Preview'
          mkdir -p releases/chrome-extension/v3-preview releases/chrome-extension/latest
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../../../../releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip .
          cd ../../../..
          cp releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip releases/chrome-extension/latest/brauzio-chrome-latest.zip
          unzip -t releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip >/dev/null
          echo 'SUCCESS all verification stages passed'

      - name: Persist verified 3.0.4
        if: success()
        run: |
          git rm scripts/apply-v304-from-v3.py
          rm -f .github/v304-build-trigger .github/v304-last-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: Brauzio 3.0.4 comprehensive repair [skip ci]'
          git push origin HEAD:fix/v3.0.4-from-v3

      - name: Persist failure diagnostics only
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 160 /tmp/v304.log > .github/v304-last-run.txt || echo 'No diagnostic log captured' > .github/v304-last-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/v304-last-run.txt
          git commit -m 'test: persist Brauzio 3.0.4 build failure [skip ci]' || true
          git push origin HEAD:fix/v3.0.4-from-v3
