name: Verify Brauzio 3.0.4 comprehensive repair

on:
  push:
    branches: [fix/v3.0.4-from-v3]
    paths:
      - '.github/v304-build-trigger'
      - '.github/workflows/build-v304-from-v3.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.4-from-v3
          fetch-depth: 0

      - name: Fetch stable 3.0.3 source
        run: git fetch origin main

      - name: Port only live-verified 3.0.3 fixes
        run: |
          git checkout origin/main -- \
            app/chrome-extension/entrypoints/background/index.ts \
            app/chrome-extension/entrypoints/background/popup-live-view.ts \
            app/chrome-extension/entrypoints/background/tools/browser/live-view.ts \
            app/chrome-extension/entrypoints/popup/App.vue \
            app/chrome-extension/entrypoints/popup/style.css \
            app/chrome-extension/utils/image-utils.ts \
            app/cloudflare-mcp/src/browser-session.ts

      - name: Apply comprehensive 3.0.4 patch
        run: python scripts/apply-v304-from-v3.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared runtime
        run: pnpm --filter brauzio-shared build

      - name: Check Worker
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Dry-build Worker
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Typecheck extension
        run: pnpm --filter brauzio-extension compile

      - name: Build extension
        run: pnpm --filter brauzio-extension build

      - name: Verify output and package Preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('app/chrome-extension/.output/chrome-mv3')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest.get('version') == '3.0.4', manifest.get('version')
          perms=set(manifest.get('permissions', []))
          for p in ('clipboardRead','clipboardWrite','offscreen','debugger'):
              assert p in perms, p
          bg=(root/'background.js').read_text(errors='ignore')
          for needle in ('chrome_observe','chrome_resolve','chrome_act','chrome_clipboard','chrome_artifacts','brauzio-popup-live-view-tab-v1','dispatchHtml5Drag'):
              assert needle in bg, needle
          print('Generated Brauzio 3.0.4 verification PASS')
          PY
          mkdir -p releases/chrome-extension/v3-preview releases/chrome-extension/latest
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr ../../../../releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip .
          cd ../../../..
          cp releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip releases/chrome-extension/latest/brauzio-chrome-latest.zip
          unzip -t releases/chrome-extension/v3-preview/brauzio-chrome-3.0.4-preview.zip >/dev/null

      - name: Persist only verified source + Preview
        run: |
          git rm scripts/apply-v304-from-v3.py
          git rm .github/v304-build-trigger || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: Brauzio 3.0.4 comprehensive repair [skip ci]'
          git push origin HEAD:fix/v3.0.4-from-v3
