name: Brauzio Chinese audit

on:
  push:
    paths:
      - '.github/workflows/chinese-audit.yml'
      - 'scripts/audit_chinese.py'
      - 'scripts/audit_ui_chinese.py'
      - 'app/chrome-extension/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all source and docs
        run: python scripts/audit_chinese.py

      - name: Scan user-facing UI
        run: python scripts/audit_ui_chinese.py

      - name: Commit audit reports
        shell: bash
        run: |
          git add docs/CHINESE_AUDIT.md docs/UI_CHINESE_STRINGS.md
          if git diff --cached --quiet; then
            echo "Audit reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Chinese-language audits"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
