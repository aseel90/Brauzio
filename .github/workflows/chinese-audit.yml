name: Brauzio language audit

on:
  push:
    paths:
      - '.github/workflows/chinese-audit.yml'
      - 'scripts/audit_chinese.py'
      - 'scripts/audit_ui_chinese.py'
      - 'app/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Chinese locale folders are absent
        shell: bash
        run: |
          test ! -e app/chrome-extension/_locales/zh_CN
          test ! -e app/chrome-extension/_locales/zh_TW

      - name: Scan user-facing UI
        run: python scripts/audit_ui_chinese.py

      - name: Require zero user-facing Chinese text
        shell: bash
        run: |
          grep -Fq 'Potential user-facing CJK lines: **0**' docs/UI_CHINESE_STRINGS.md

      - name: Scan all Brauzio source and docs
        run: python scripts/audit_chinese.py

      - name: Print full audit summary
        shell: bash
        run: |
          sed -n '1,90p' docs/CHINESE_AUDIT.md
