# Brauzio 3.0.5 runtime deployment trigger
name: Deploy Brauzio Cloudflare MCP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'app/cloudflare-mcp/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAUZIO_BROWSER_SHARED_SECRET: ${{ secrets.BRAUZIO_BROWSER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BRAUZIO_BROWSER_SHARED_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          if [ "${#BRAUZIO_BROWSER_SHARED_SECRET}" -lt 24 ]; then
            echo 'Brauzio browser shared secret must be at least 24 characters.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Ensure OAuth KV namespace
        working-directory: app/cloudflare-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH_HEADER="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          response=$(curl -fsS -H "$AUTH_HEADER" "$API?per_page=100")
          namespace_id=$(printf '%s' "$response" | jq -r '.result[] | select(.title == "brauzio-oauth") | .id' | head -n1)

          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            created=$(curl -fsS -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
              --data '{"title":"brauzio-oauth"}' "$API")
            namespace_id=$(printf '%s' "$created" | jq -r '.result.id')
          fi

          if ! [[ "$namespace_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Failed to resolve Brauzio OAuth KV namespace id." >&2
            exit 1
          fi

          python - "$namespace_id" <<'PY'
          from pathlib import Path
          import sys
          path = Path('wrangler.jsonc')
          text = path.read_text(encoding='utf-8')
          placeholder = '00000000000000000000000000000000'
          if placeholder not in text:
              raise SystemExit('OAuth KV placeholder is missing from wrangler.jsonc')
          path.write_text(text.replace(placeholder, sys.argv[1]), encoding='utf-8')
          PY

      - name: Configure Cloudflare secrets
        working-directory: app/cloudflare-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAUZIO_BROWSER_SHARED_SECRET: ${{ secrets.BRAUZIO_BROWSER_SHARED_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BRAUZIO_BROWSER_SHARED_SECRET" | pnpm exec wrangler secret put BROWSER_SHARED_SECRET

      - name: Deploy Brauzio Worker
        working-directory: app/cloudflare-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deployment summary
        run: |
          echo 'Brauzio Cloud MCP deployment completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker name: brauzio-mcp' >> "$GITHUB_STEP_SUMMARY"
          echo 'MCP endpoint: https://<your-worker-domain>/mcp' >> "$GITHUB_STEP_SUMMARY"
          echo 'Authentication: OAuth 2.1 + one-time Brauzio pairing code' >> "$GITHUB_STEP_SUMMARY"
          echo 'WebSocket endpoint: wss://<your-worker-domain>/ws?device=<device-id>' >> "$GITHUB_STEP_SUMMARY"
