name: Deploy Brauzio Cloudflare MCP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'app/cloudflare-mcp/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAUZIO_BROWSER_SHARED_SECRET: ${{ secrets.BRAUZIO_BROWSER_SHARED_SECRET }}
          BRAUZIO_MCP_SHARED_SECRET: ${{ secrets.BRAUZIO_MCP_SHARED_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BRAUZIO_BROWSER_SHARED_SECRET BRAUZIO_MCP_SHARED_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          if [ "${#BRAUZIO_BROWSER_SHARED_SECRET}" -lt 24 ] || [ "${#BRAUZIO_MCP_SHARED_SECRET}" -lt 24 ]; then
            echo 'Brauzio shared secrets must be at least 24 characters.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Cloud MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Configure Cloudflare secrets
        working-directory: app/cloudflare-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAUZIO_BROWSER_SHARED_SECRET: ${{ secrets.BRAUZIO_BROWSER_SHARED_SECRET }}
          BRAUZIO_MCP_SHARED_SECRET: ${{ secrets.BRAUZIO_MCP_SHARED_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BRAUZIO_BROWSER_SHARED_SECRET" | pnpm exec wrangler secret put BROWSER_SHARED_SECRET
          printf '%s' "$BRAUZIO_MCP_SHARED_SECRET" | pnpm exec wrangler secret put MCP_SHARED_SECRET

      - name: Deploy Brauzio Worker
        working-directory: app/cloudflare-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deployment summary
        run: |
          echo 'Brauzio Cloud MCP deployment completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker name: brauzio-mcp' >> "$GITHUB_STEP_SUMMARY"
          echo 'MCP endpoint: https://<your-worker-domain>/mcp?device=<device-id>' >> "$GITHUB_STEP_SUMMARY"
          echo 'WebSocket endpoint: wss://<your-worker-domain>/ws?device=<device-id>' >> "$GITHUB_STEP_SUMMARY"
