name: Brauzio CI Diagnose 260

on:
  push:
    branches: [ci-diagnose-260]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Run Brauzio build diagnostics
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LOG=CI_DIAGNOSE_260.txt
          : > "$LOG"

          python - <<'PY'
          from pathlib import Path
          path = Path('packages/shared/src/tools.ts')
          text = path.read_text(encoding='utf-8')
          old = 'export const TOOL_SCHEMAS: Tool[] = ['
          if old not in text:
              raise SystemExit('TOOL_SCHEMAS declaration marker not found')
          text = text.replace(old, 'export const TOOL_SCHEMAS = [', 1)
          stripped = text.rstrip()
          if not stripped.endswith('];'):
              raise SystemExit('TOOL_SCHEMAS closing marker not found')
          stripped = stripped[:-2] + '] satisfies Tool[];'
          path.write_text(stripped + '\n', encoding='utf-8')
          PY

          printf 'Applied diagnostic type fix: TOOL_SCHEMAS uses satisfies Tool[]\n' >> "$LOG"
          git diff -- packages/shared/src/tools.ts >> "$LOG"

          run_step() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            code=$?
            printf '\n__EXIT_CODE__=%s\n' "$code" | tee -a "$LOG"
            if [ "$code" -ne 0 ]; then
              printf '__FAILED_STEP__=%s\n' "$label" | tee -a "$LOG"
              exit "$code"
            fi
          }

          run_step install pnpm install --no-frozen-lockfile --ignore-scripts
          run_step wxt_prepare pnpm --filter brauzio-extension exec wxt prepare
          run_step shared_build pnpm --filter brauzio-shared build
          run_step cloud_check pnpm --filter brauzio-cloud-mcp check
          run_step cloud_build pnpm --filter brauzio-cloud-mcp build
          run_step extension_compile pnpm --filter brauzio-extension compile
          run_step extension_build pnpm --filter brauzio-extension build
          printf '\n__DIAGNOSTIC_RESULT__=SUCCESS\n' >> "$LOG"

      - name: Commit diagnostic output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore packages/shared/src/tools.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f CI_DIAGNOSE_260.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostics: capture Brauzio type-fix validation [skip ci]'
          git push
