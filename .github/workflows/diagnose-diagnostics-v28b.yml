name: Diagnose Brauzio Diagnostics V28B

on:
  push:
    branches: [diagnostics-v28]
    paths:
      - '.github/workflows/diagnose-diagnostics-v28b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - name: Diagnose applied source
        shell: bash
        run: |
          set +e
          LOG=DIAGNOSTICS_V28B_LOG.txt
          : > "$LOG"
          pnpm install --no-frozen-lockfile --ignore-scripts > /tmp/install.log 2>&1
          echo "install=$?" >> "$LOG"

          python - <<'PY' > /tmp/apply.log 2>&1
          from pathlib import Path
          p = Path('.github/workflows/apply-diagnostics-v28.yml')
          text = p.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          raw = text[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          exec(compile(code, str(p), 'exec'), {})
          PY
          echo "apply=$?" >> "$LOG"
          cat /tmp/apply.log >> "$LOG"

          run_stage() {
            name="$1"; shift
            "$@" > "/tmp/${name}.log" 2>&1
            code=$?
            echo "${name}=${code}" >> "$LOG"
            tail -160 "/tmp/${name}.log" >> "$LOG"
          }
          run_stage shared_build pnpm --filter brauzio-shared build
          run_stage cloud_check pnpm --filter brauzio-cloud-mcp check
          run_stage cloud_build pnpm --filter brauzio-cloud-mcp build
          run_stage wxt_prepare pnpm --filter brauzio-extension exec wxt prepare
          run_stage extension_compile pnpm --filter brauzio-extension compile
          run_stage extension_build pnpm --filter brauzio-extension build

          git checkout -- . ':!.github/workflows/diagnose-diagnostics-v28b.yml' || true
          git clean -fd -e "$LOG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOG"
          git commit -m 'diagnostics: capture applied Brauzio 2.8 error [skip ci]' || true
          git push || true
