name: Emergency relay source repair

on:
  push:
    paths:
      - '.github/workflows/emergency-relay-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good sources and apply 3.0.2 relay fix
        shell: bash
        run: |
          git checkout 5f1ba062cd0df532c0f356d0fbe191f20a2b0d4f -- \
            app/cloudflare-mcp/src/browser-session.ts \
            app/cloudflare-mcp/src/index.ts \
            app/chrome-extension/package.json
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/cloudflare-mcp/src/browser-session.ts')
          s = p.read_text()
          old = """      ws.serializeAttachment(next);\n      sessionLog('HELLO', { deviceId: attachment.deviceId, authenticated, extensionVersion: next.extensionVersion || '' });\n      const controlState = await this.getControlState();\n"""
          new = """      ws.serializeAttachment(next);\n      sessionLog('HELLO', { deviceId: attachment.deviceId, authenticated, extensionVersion: next.extensionVersion || '' });\n\n      // A reconnect can leave an older hibernating WebSocket looking OPEN for a\n      // short time. Tool forwarding previously picked the first authenticated\n      // socket, which could route every command to that stale connection and\n      // make the MCP call hang until its timeout. Once a new browser connection\n      // authenticates, make it authoritative and retire older sockets for the\n      // same device.\n      if (authenticated) {\n        for (const other of this.ctx.getWebSockets('browser')) {\n          if (other === ws) continue;\n          try {\n            const otherAttachment = other.deserializeAttachment() as SocketAttachment | null;\n            if (\n              other.readyState === WebSocket.OPEN &&\n              otherAttachment?.authenticated === true &&\n              otherAttachment.deviceId === next.deviceId\n            ) {\n              sessionLog('WS_SUPERSEDED', {\n                deviceId: next.deviceId,\n                oldConnectedAt: otherAttachment.connectedAt,\n                newConnectedAt: next.connectedAt,\n              });\n              other.close(4001, 'Superseded by newer Brauzio connection');\n            }\n          } catch {}\n        }\n      }\n\n      const controlState = await this.getControlState();\n"""
          if old not in s:
              raise SystemExit('hello patch anchor not found')
          s = s.replace(old, new)
          old2 = """  private authenticatedSockets(): WebSocket[] {\n    return this.ctx.getWebSockets('browser').filter((ws) => {\n      try {\n        const attachment = ws.deserializeAttachment() as SocketAttachment | null;\n        return attachment?.authenticated === true && ws.readyState === WebSocket.OPEN;\n      } catch { return false; }\n    });\n  }\n"""
          new2 = """  private authenticatedSockets(): WebSocket[] {\n    return this.ctx\n      .getWebSockets('browser')\n      .filter((ws) => {\n        try {\n          const attachment = ws.deserializeAttachment() as SocketAttachment | null;\n          return attachment?.authenticated === true && ws.readyState === WebSocket.OPEN;\n        } catch {\n          return false;\n        }\n      })\n      .sort((left, right) => {\n        try {\n          const leftAttachment = left.deserializeAttachment() as SocketAttachment | null;\n          const rightAttachment = right.deserializeAttachment() as SocketAttachment | null;\n          return Number(rightAttachment?.connectedAt || 0) - Number(leftAttachment?.connectedAt || 0);\n        } catch {\n          return 0;\n        }\n      });\n  }\n"""
          if old2 not in s:
              raise SystemExit('socket selection patch anchor not found')
          p.write_text(s.replace(old2, new2))

          p = Path('app/cloudflare-mcp/src/index.ts')
          s = p.read_text()
          s = s.replace("const BRAUZIO_RUNTIME_VERSION = '2.9.3';", "const BRAUZIO_RUNTIME_VERSION = '3.0.2';")
          s = s.replace("const BRAUZIO_SCHEMA_VERSION = 'v2.9.3-2026-09-07';", "const BRAUZIO_SCHEMA_VERSION = '3.0.2';")
          p.write_text(s)

          p = Path('app/chrome-extension/package.json')
          s = p.read_text().replace('"version": "2.9.3"', '"version": "3.0.2"')
          p.write_text(s)
          PY
      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/cloudflare-mcp/src/browser-session.ts app/cloudflare-mcp/src/index.ts app/chrome-extension/package.json
          git commit -m "fix(relay): supersede stale sockets and sync 3.0.2"
          git push origin HEAD:main
