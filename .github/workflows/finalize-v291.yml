name: Finalize Brauzio 2.9.1

on:
  push:
    paths:
      - '.github/workflows/finalize-v291.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Restore full files and apply 2.9.1 changes
        shell: bash
        run: |
          set -euo pipefail
          BAD=71f7bcd8fcd9d7526774988f8c8c69fa4c614201
          git show ${BAD}^:app/chrome-extension/utils/smart-wait.ts > app/chrome-extension/utils/smart-wait.ts
          git show ${BAD}^:packages/shared/src/tools.ts > packages/shared/src/tools.ts
          git show ${BAD}^:app/cloudflare-mcp/src/index.ts > app/cloudflare-mcp/src/index.ts
          git show ${BAD}^:docs/CHANGELOG.md > docs/CHANGELOG.md
          git show ${BAD}^:docs/ROADMAP.md > docs/ROADMAP.md
          python - <<'PY'
          from pathlib import Path
          import json

          smart = Path('app/chrome-extension/utils/smart-wait.ts')
          s = smart.read_text()
          a = s.index('async function waitForDomCondition(')
          b = s.index('\nasync function waitForUrl', a)
          replacement = '''async function waitForDomCondition(
            tabId: number,
            options: SmartWaitOptions,
            timeoutMs: number,
          ): Promise<Omit<SmartWaitResult, 'condition' | 'elapsedMs'>> {
            const condition = options.condition as
              | 'selector_exists'
              | 'selector_hidden'
              | 'text_appears'
              | 'text_disappears';
            const selector = String(options.selector || '');
            const text = String(options.text || '');
            const startedAt = Date.now();
            let attempts = 0;
            let lastError = '';

            const checkOnce = async (): Promise<{ matched: boolean; error?: string }> => {
              try {
                const result = await chrome.scripting.executeScript({
                  target: { tabId },
                  world: 'ISOLATED',
                  func: (
                    conditionName: 'selector_exists' | 'selector_hidden' | 'text_appears' | 'text_disappears',
                    selectorValue: string,
                    textValue: string,
                  ) => {
                    const visible = (element: Element | null) => {
                      if (!element) return false;
                      if (!(element instanceof HTMLElement)) return true;
                      const style = getComputedStyle(element);
                      const rect = element.getBoundingClientRect();
                      return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) > 0 && rect.width > 0 && rect.height > 0;
                    };
                    try {
                      if (conditionName === 'selector_exists') return { matched: Boolean(selectorValue && document.querySelector(selectorValue)) };
                      if (conditionName === 'selector_hidden') return { matched: !visible(document.querySelector(selectorValue)) };
                      const pageText = document.body?.innerText || document.documentElement?.innerText || '';
                      const hasText = Boolean(textValue) && pageText.includes(textValue);
                      return { matched: conditionName === 'text_appears' ? hasText : !hasText };
                    } catch (error) {
                      return { matched: false, error: error instanceof Error ? error.message : String(error) };
                    }
                  },
                  args: [condition, selector, text],
                });
                const payload = result?.[0]?.result as { matched?: boolean; error?: string } | undefined;
                return { matched: Boolean(payload?.matched), error: payload?.error };
              } catch (error) {
                return { matched: false, error: error instanceof Error ? error.message : String(error) };
              }
            };

            while (Date.now() - startedAt <= timeoutMs) {
              attempts += 1;
              const check = await checkOnce();
              if (check.matched) return { ok: true, details: { immediate: attempts === 1, attempts } };
              if (check.error) lastError = check.error;
              const remaining = timeoutMs - (Date.now() - startedAt);
              if (remaining <= 0) break;
              await new Promise((resolve) => setTimeout(resolve, Math.min(125, remaining)));
            }
            return { ok: false, timedOut: true, reason: 'timeout', details: { attempts, lastError: lastError || undefined } };
          }
          '''
          smart.write_text(s[:a] + replacement + s[b:])

          tools = Path('packages/shared/src/tools.ts')
          t = tools.read_text()
          t = t.replace("    LIVE_VIEW: 'chrome_live_view',\n", "    LIVE_VIEW: 'chrome_live_view',\n    DEVICE_MODE: 'chrome_device_mode',\n", 1)
          marker = "  { name: TOOL_NAMES.BROWSER.LIVE_VIEW, description: 'Start a lightweight memory-only Live View of the active tab, inspect status, fetch the latest one to three frames as MCP images, or stop it. Frames are compressed, duplicate frames are dropped, and nothing is saved to disk.', inputSchema: { type: 'object', properties: { action: { type: 'string', enum: ['start', 'status', 'latest', 'stop'] }, intervalMs: { type: 'number', description: 'Capture interval in milliseconds, clamped to 550-5000. Default 900.' }, scale: { type: 'number', description: 'Frame scale 0.35-1. Default 0.65.' }, quality: { type: 'number', description: 'JPEG quality 0.4-0.92. Default 0.72.' }, maxFrames: { type: 'number', description: 'In-memory ring buffer size, 1-3. Default 2.' }, count: { type: 'number', description: 'For latest, return 1-3 newest frames.' }, ...tabTarget }, required: ['action'] } },\n"
          device = "  { name: TOOL_NAMES.BROWSER.DEVICE_MODE, description: 'Emulate common phone, tablet, laptop, or custom viewport sizes in the current tab. Supports portrait/landscape orientation, DPR, mobile layout, touch input, status inspection, presets, and reset.', inputSchema: { type: 'object', properties: { action: { type: 'string', enum: ['list_presets', 'apply', 'custom', 'status', 'reset'] }, preset: { type: 'string', description: 'Preset device name for action=apply.' }, orientation: { type: 'string', enum: ['portrait', 'landscape'], description: 'Optional orientation override.' }, width: { type: 'number', description: 'CSS viewport width for action=custom.' }, height: { type: 'number', description: 'CSS viewport height for action=custom.' }, deviceScaleFactor: { type: 'number', description: 'Device pixel ratio for custom mode.' }, mobile: { type: 'boolean', description: 'Use mobile layout metrics for custom mode.' }, touch: { type: 'boolean', description: 'Enable touch emulation for custom mode.' }, ...tabTarget }, required: ['action'] } },\n"
          if marker not in t: raise SystemExit('live view schema marker missing')
          t = t.replace(marker, marker + device, 1)
          tools.write_text(t)

          cloud = Path('app/cloudflare-mcp/src/index.ts')
          c = cloud.read_text().replace("const BRAUZIO_RUNTIME_VERSION = '2.9.0';", "const BRAUZIO_RUNTIME_VERSION = '2.9.1';", 1).replace("const BRAUZIO_SCHEMA_VERSION = 'v2.9.0-2026-09-07';", "const BRAUZIO_SCHEMA_VERSION = 'v2.9.1-2026-09-07';", 1)
          cloud.write_text(c)

          pkg = Path('app/chrome-extension/package.json')
          p = json.loads(pkg.read_text()); p['version'] = '2.9.1'; pkg.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n')

          changelog = Path('docs/CHANGELOG.md')
          ch = changelog.read_text(); head = '# Brauzio Changelog\n\n'; entry = "## 2026-09-07 — Extension/Cloud V2.9.1 Smart Wait + Device Mode\n\n- إصلاح Smart Wait للـ DOM بحيث يحترم `timeoutMs` فعليًا عبر polling آمن من طبقة الإضافة.\n- إصلاح Verify للنصوص والـ selectors المبني على Smart Wait.\n- إضافة `chrome_device_mode` مع presets للهواتف والتابلت واللابتوب/الديسكتوب.\n- دعم portrait/landscape وDPR وmobile metrics وtouch emulation وcustom viewport وstatus/reset.\n- يبقى Device Mode فعالًا أثناء التنقل حتى `reset` أو إغلاق التبويب.\n- رفع runtime/schema إلى 2.9.1.\n\n"
          changelog.write_text(head + entry + ch[len(head):] if ch.startswith(head) else entry + ch)

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text(); section = "## Phase 9.5 — Smart Wait Hardening + Device/Viewport Mode — P0/P1\n\n- [x] إصلاح DOM Smart Wait polling ليحترم المهلة الفعلية.\n- [x] إصلاح Verify للنصوص والـ selectors.\n- [x] `chrome_device_mode` مع presets / custom / status / reset.\n- [x] portrait / landscape وDPR وmobile metrics وtouch emulation.\n- [ ] E2E على GitHub وMDN ونموذج حقيقي بعد تثبيت ZIP 2.9.1.\n\n"
          if 'Phase 9.5 — Smart Wait Hardening' not in r:
              r = r.replace('## Phase 10 — Virtual Cursor UX', section + '## Phase 10 — Virtual Cursor UX', 1)
          roadmap.write_text(r)
          PY
      - name: Validate
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build
      - name: Commit validated 2.9.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chrome-extension/utils/smart-wait.ts packages/shared/src/tools.ts app/cloudflare-mcp/src/index.ts app/chrome-extension/package.json docs/CHANGELOG.md docs/ROADMAP.md app/chrome-extension/entrypoints/background/tools/browser/device-mode.ts app/chrome-extension/entrypoints/background/tools/browser/index.ts
          git commit -m 'Finalize Brauzio 2.9.1 Smart Wait and Device Mode' || true
          git push
