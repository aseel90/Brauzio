name: Finalize Brauzio 2.9.3

on:
  push:
    paths:
      - '.github/workflows/finalize-v293.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - name: Build extension
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          cd app/chrome-extension/.output/chrome-mv3
          python - <<'PY'
          import json
          manifest=json.load(open('manifest.json', encoding='utf-8'))
          assert manifest.get('version') == '2.9.3', manifest.get('version')
          print('Verified manifest version:', manifest['version'])
          PY
          zip -qr ../brauzio-chrome.zip .
          cd ../../../..
          unzip -t app/chrome-extension/.output/brauzio-chrome.zip >/dev/null
          mkdir -p releases/chrome-extension/latest
          cp app/chrome-extension/.output/brauzio-chrome.zip releases/chrome-extension/latest/brauzio-chrome-latest.zip
          printf 'status=success\nversion=2.9.3\ncommit=%s\n' "$GITHUB_SHA" > releases/chrome-extension/latest/v293-build-status.txt
      - name: Publish verified package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/chrome-extension/latest/brauzio-chrome-latest.zip releases/chrome-extension/latest/v293-build-status.txt
          git commit -m 'build: publish verified Brauzio Chrome extension 2.9.3 [skip ci]'
          git push
