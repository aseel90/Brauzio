name: Verify Brauzio OAuth Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oauth-live-verification.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify deployed OAuth endpoints
        shell: bash
        run: |
          set -u
          BASE='https://brauzio-mcp.aseelsalah266.workers.dev'
          RESULT='oauth-live-result.txt'
          : > "$RESULT"
          echo "Brauzio OAuth live verification" >> "$RESULT"
          echo "UTC: $(date -u +%FT%TZ)" >> "$RESULT"

          health=''
          for i in $(seq 1 24); do
            health=$(curl -fsS --max-time 15 "$BASE/health" 2>&1 || true)
            if printf '%s' "$health" | grep -q '"version":"2.1.0"'; then
              break
            fi
            sleep 10
          done
          echo "HEALTH=$health" >> "$RESULT"

          protected_status=$(curl -sS -o /tmp/protected -w '%{http_code}' --max-time 15 "$BASE/.well-known/oauth-protected-resource" || true)
          echo "PROTECTED_STATUS=$protected_status" >> "$RESULT"
          echo "PROTECTED_BODY=$(tr '\n' ' ' </tmp/protected 2>/dev/null | head -c 4000)" >> "$RESULT"

          auth_status=$(curl -sS -o /tmp/authmeta -w '%{http_code}' --max-time 15 "$BASE/.well-known/oauth-authorization-server" || true)
          echo "AUTH_SERVER_STATUS=$auth_status" >> "$RESULT"
          echo "AUTH_SERVER_BODY=$(tr '\n' ' ' </tmp/authmeta 2>/dev/null | head -c 4000)" >> "$RESULT"

          mcp_status=$(curl -sS -D /tmp/mcpheaders -o /tmp/mcpbody -w '%{http_code}' --max-time 15 "$BASE/mcp" || true)
          echo "MCP_UNAUTH_STATUS=$mcp_status" >> "$RESULT"
          echo "MCP_WWW_AUTH=$(grep -i '^www-authenticate:' /tmp/mcpheaders 2>/dev/null | tr '\n' ' ' | head -c 2000)" >> "$RESULT"
          echo "MCP_BODY=$(tr '\n' ' ' </tmp/mcpbody 2>/dev/null | head -c 2000)" >> "$RESULT"

          if printf '%s' "$health" | grep -q '"version":"2.1.0"' \
            && printf '%s' "$health" | grep -q '"auth":"oauth2.1-pairing"' \
            && [ "$protected_status" = '200' ] \
            && [ "$auth_status" = '200' ] \
            && [ "$mcp_status" = '401' ]; then
            echo 'RESULT=PASS' >> "$RESULT"
          else
            echo 'RESULT=FAIL' >> "$RESULT"
          fi
      - name: Publish verification result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oauth-live-result.txt
          git commit -m 'ci: record temporary OAuth live verification [skip ci]' || exit 0
          git push
