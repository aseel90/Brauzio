name: OAuth Pairing Diagnostics

on:
  push:
    branches:
      - fix/oauth-pairing-before-install

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - name: Run build diagnostics
        id: diag
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/brauzio-oauth-diagnostics.log"
          {
            echo '## install'
            pnpm install --no-frozen-lockfile --ignore-scripts
            echo "INSTALL_EXIT=$?"
            echo '## wxt prepare'
            pnpm --filter brauzio-extension exec wxt prepare
            echo "WXT_EXIT=$?"
            echo '## shared build'
            pnpm --filter brauzio-shared build
            echo "SHARED_EXIT=$?"
            echo '## cloud typecheck'
            pnpm --filter brauzio-cloud-mcp check
            echo "CLOUD_CHECK_EXIT=$?"
            echo '## cloud build'
            pnpm --filter brauzio-cloud-mcp build
            echo "CLOUD_BUILD_EXIT=$?"
            echo '## extension build'
            pnpm --filter brauzio-extension build
            echo "EXT_BUILD_EXIT=$?"
          } >"$LOG" 2>&1
          tail -c 24000 "$LOG" > "$RUNNER_TEMP/tail.log"
          {
            echo 'BODY<<EOF'
            echo 'Temporary CI diagnostic output:'
            echo '```text'
            cat "$RUNNER_TEMP/tail.log"
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Comment diagnostics on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diag.outputs.BODY }}
        run: gh pr comment 5 --body "$BODY"
