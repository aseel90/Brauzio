name: Build Brauzio 2.9 Live View

on:
  push:
    paths:
      - '.github/workflows/release-29-live-view.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-live-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Apply Brauzio 2.9 Live View
        shell: bash
        run: |
          set -euo pipefail
          cat > app/chrome-extension/entrypoints/background/tools/browser/live-view.ts <<'EOF'
          import { createErrorResponse, type ToolResult } from '@/common/tool-handler';
          import { BaseBrowserToolExecutor } from '../base-browser';
          import { TOOL_NAMES } from 'brauzio-shared';
          import { compressImage } from '../../../../utils/image-utils';

          const MIN_INTERVAL_MS = 550;
          const MAX_INTERVAL_MS = 5000;
          const DEFAULT_INTERVAL_MS = 900;
          const DEFAULT_SCALE = 0.65;
          const DEFAULT_QUALITY = 0.72;
          const MAX_BUFFERED_FRAMES = 3;
          const IDLE_STOP_MS = 15_000;

          type LiveViewAction = 'start' | 'status' | 'latest' | 'stop';

          interface LiveViewArgs {
            action: LiveViewAction;
            tabId?: number;
            windowId?: number;
            intervalMs?: number;
            scale?: number;
            quality?: number;
            maxFrames?: number;
            count?: number;
          }

          interface LiveFrame {
            seq: number;
            capturedAt: number;
            data: string;
            mimeType: string;
            fingerprint: string;
            bytes: number;
          }

          interface LiveViewSession {
            tabId: number;
            windowId: number;
            startedAt: number;
            lastClientTouchAt: number;
            intervalMs: number;
            scale: number;
            quality: number;
            maxFrames: number;
            captured: number;
            droppedDuplicates: number;
            lastFrameAt?: number;
            lastError?: string;
            running: boolean;
            timer?: ReturnType<typeof setTimeout>;
            capturing: boolean;
            frames: LiveFrame[];
          }

          const sessions = new Map<number, LiveViewSession>();
          let nextSeq = 1;

          function clamp(value: unknown, fallback: number, min: number, max: number): number {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return fallback;
            return Math.min(max, Math.max(min, numeric));
          }

          function frameFingerprint(base64: string): string {
            if (!base64) return 'empty';
            const step = Math.max(1, Math.floor(base64.length / 24));
            let sample = '';
            for (let i = 0; i < base64.length && sample.length < 24; i += step) sample += base64[i];
            return `${base64.length}:${sample}`;
          }

          function sessionStatus(session?: LiveViewSession) {
            if (!session) return { running: false, storage: 'memory-only', fileSaved: false };
            return {
              running: session.running,
              tabId: session.tabId,
              windowId: session.windowId,
              startedAt: session.startedAt,
              intervalMs: session.intervalMs,
              scale: session.scale,
              quality: session.quality,
              maxFrames: session.maxFrames,
              bufferedFrames: session.frames.length,
              captured: session.captured,
              droppedDuplicates: session.droppedDuplicates,
              lastFrameAt: session.lastFrameAt ?? null,
              lastError: session.lastError ?? null,
              storage: 'memory-only',
              fileSaved: false,
            };
          }

          function stopSession(tabId: number, reason = 'stopped'): boolean {
            const session = sessions.get(tabId);
            if (!session) return false;
            session.running = false;
            if (session.timer) clearTimeout(session.timer);
            session.timer = undefined;
            session.frames.length = 0;
            sessions.delete(tabId);
            console.log('[BrauzioLiveView]', new Date().toISOString(), 'STOP', { tabId, reason });
            return true;
          }

          export function stopAllLiveViews(reason = 'stopped'): number {
            const tabIds = [...sessions.keys()];
            for (const tabId of tabIds) stopSession(tabId, reason);
            return tabIds.length;
          }

          async function captureOne(session: LiveViewSession): Promise<void> {
            if (!session.running || session.capturing) return;
            session.capturing = true;
            try {
              const tab = await chrome.tabs.get(session.tabId);
              if (!tab.active || tab.windowId !== session.windowId) {
                session.lastError = 'Live View paused: target tab is no longer active in its window';
                return;
              }
              if (!tab.url || /^(chrome|edge|about|chrome-extension):/i.test(tab.url)) {
                session.lastError = 'Live View cannot capture protected browser or extension pages';
                stopSession(session.tabId, 'protected_page');
                return;
              }

              const sourceDataUrl = await chrome.tabs.captureVisibleTab(session.windowId, {
                format: 'jpeg',
                quality: 85,
              });
              if (!sourceDataUrl) throw new Error('captureVisibleTab returned empty data');

              const compressed = await compressImage(sourceDataUrl, {
                scale: session.scale,
                quality: session.quality,
                format: 'image/jpeg',
              });
              const base64 = compressed.dataUrl.replace(/^data:image\/[^;]+;base64,/, '');
              const fingerprint = frameFingerprint(base64);
              const previous = session.frames[session.frames.length - 1];
              if (previous?.fingerprint === fingerprint) {
                session.droppedDuplicates += 1;
                session.lastFrameAt = Date.now();
                return;
              }

              const frame: LiveFrame = {
                seq: nextSeq++,
                capturedAt: Date.now(),
                data: base64,
                mimeType: compressed.mimeType,
                fingerprint,
                bytes: Math.ceil((base64.length * 3) / 4),
              };
              session.frames.push(frame);
              while (session.frames.length > session.maxFrames) session.frames.shift();
              session.captured += 1;
              session.lastFrameAt = frame.capturedAt;
              session.lastError = undefined;
            } catch (error) {
              session.lastError = error instanceof Error ? error.message : String(error);
            } finally {
              session.capturing = false;
            }
          }

          function schedule(session: LiveViewSession): void {
            if (!session.running) return;
            session.timer = setTimeout(async () => {
              if (!session.running) return;
              if (Date.now() - session.lastClientTouchAt > IDLE_STOP_MS) {
                stopSession(session.tabId, 'agent_idle_timeout');
                return;
              }
              await captureOne(session);
              schedule(session);
            }, session.intervalMs);
          }

          class LiveViewTool extends BaseBrowserToolExecutor {
            name = TOOL_NAMES.BROWSER.LIVE_VIEW;

            async execute(args: LiveViewArgs): Promise<ToolResult> {
              const action = args.action;
              if (!['start', 'status', 'latest', 'stop'].includes(action)) {
                return createErrorResponse('action must be start, status, latest, or stop');
              }

              if (action === 'status' && typeof args.tabId !== 'number') {
                for (const session of sessions.values()) session.lastClientTouchAt = Date.now();
                return {
                  content: [{ type: 'text', text: JSON.stringify({ sessions: [...sessions.values()].map(sessionStatus), storage: 'memory-only', fileSaved: false }) }],
                  isError: false,
                };
              }

              const explicit = await this.tryGetTab(args.tabId);
              const tab = explicit || (await this.getActiveTabOrThrowInWindow(args.windowId));
              if (!tab.id) return createErrorResponse('Target tab not found');

              if (action === 'status') {
                const session = sessions.get(tab.id);
                if (session) session.lastClientTouchAt = Date.now();
                return { content: [{ type: 'text', text: JSON.stringify(sessionStatus(session)) }], isError: false };
              }

              if (action === 'stop') {
                const stopped = stopSession(tab.id, 'tool_stop');
                return { content: [{ type: 'text', text: JSON.stringify({ success: true, stopped, tabId: tab.id, storage: 'memory-only', fileSaved: false }) }], isError: false };
              }

              if (action === 'start') {
                if (!tab.active) return createErrorResponse('Live View requires the target tab to be active. Switch to it first.');
                if (!tab.url || /^(chrome|edge|about|chrome-extension):/i.test(tab.url)) {
                  return createErrorResponse('Live View cannot capture protected browser or extension pages.');
                }
                stopSession(tab.id, 'restart');
                const session: LiveViewSession = {
                  tabId: tab.id,
                  windowId: tab.windowId,
                  startedAt: Date.now(),
                  lastClientTouchAt: Date.now(),
                  intervalMs: Math.round(clamp(args.intervalMs, DEFAULT_INTERVAL_MS, MIN_INTERVAL_MS, MAX_INTERVAL_MS)),
                  scale: clamp(args.scale, DEFAULT_SCALE, 0.35, 1),
                  quality: clamp(args.quality, DEFAULT_QUALITY, 0.4, 0.92),
                  maxFrames: Math.round(clamp(args.maxFrames, 2, 1, MAX_BUFFERED_FRAMES)),
                  captured: 0,
                  droppedDuplicates: 0,
                  running: true,
                  capturing: false,
                  frames: [],
                };
                sessions.set(tab.id, session);
                await captureOne(session);
                schedule(session);
                return {
                  content: [{ type: 'text', text: JSON.stringify({ success: true, ...sessionStatus(session), note: 'Frames stay in extension memory only and are never downloaded. Poll latest/status while observing; idle sessions auto-stop.' }) }],
                  isError: false,
                };
              }

              const session = sessions.get(tab.id);
              if (!session || !session.running) return createErrorResponse('Live View is not running for this tab. Call action=start first.');
              session.lastClientTouchAt = Date.now();
              if (session.frames.length === 0) await captureOne(session);
              const count = Math.round(clamp(args.count, 1, 1, session.maxFrames));
              const frames = session.frames.slice(-count);
              if (frames.length === 0) return createErrorResponse(session.lastError || 'No Live View frame is available yet');

              return {
                content: [
                  {
                    type: 'text',
                    text: JSON.stringify({
                      success: true,
                      ...sessionStatus(session),
                      returnedFrames: frames.map((frame) => ({ seq: frame.seq, capturedAt: frame.capturedAt, bytes: frame.bytes, mimeType: frame.mimeType })),
                    }),
                  },
                  ...frames.map((frame) => ({ type: 'image' as const, data: frame.data, mimeType: frame.mimeType })),
                ],
                isError: false,
              };
            }
          }

          chrome.tabs.onRemoved.addListener((tabId) => stopSession(tabId, 'tab_closed'));
          chrome.tabs.onUpdated.addListener((tabId, changeInfo) => {
            if (changeInfo.status === 'loading' || typeof changeInfo.url === 'string') stopSession(tabId, 'navigation');
          });

          export const liveViewTool = new LiveViewTool();
          EOF

          python - <<'PY'
          from pathlib import Path

          shared = Path('packages/shared/src/tools.ts')
          s = shared.read_text(encoding='utf-8')
          if "LIVE_VIEW: 'chrome_live_view'" not in s:
              s = s.replace("    GIF_RECORDER: 'chrome_gif_recorder',", "    GIF_RECORDER: 'chrome_gif_recorder',\n    LIVE_VIEW: 'chrome_live_view',", 1)
          marker = "  { name: TOOL_NAMES.BROWSER.SCREENSHOT, description: 'Capture the current page or a page element.', inputSchema: { type: 'object', properties: { name: { type: 'string' }, selector: { type: 'string' }, fullPage: { type: 'boolean' }, storeBase64: { type: 'boolean' }, savePng: { type: 'boolean' }, width: { type: 'number' }, height: { type: 'number' }, background: { type: 'boolean' }, ...tabTarget }, required: [] } },"
          live = "  { name: TOOL_NAMES.BROWSER.LIVE_VIEW, description: 'Start a lightweight memory-only Live View of the active tab, inspect status, fetch the latest one to three frames as MCP images, or stop it. Frames are compressed, duplicate frames are dropped, and nothing is saved to disk.', inputSchema: { type: 'object', properties: { action: { type: 'string', enum: ['start', 'status', 'latest', 'stop'] }, intervalMs: { type: 'number', description: 'Capture interval in milliseconds, clamped to 550-5000. Default 900.' }, scale: { type: 'number', description: 'Frame scale 0.35-1. Default 0.65.' }, quality: { type: 'number', description: 'JPEG quality 0.4-0.92. Default 0.72.' }, maxFrames: { type: 'number', description: 'In-memory ring buffer size, 1-3. Default 2.' }, count: { type: 'number', description: 'For latest, return 1-3 newest frames.' }, ...tabTarget }, required: ['action'] } },"
          if 'TOOL_NAMES.BROWSER.LIVE_VIEW' not in s:
              if marker not in s: raise SystemExit('Screenshot schema marker not found')
              s = s.replace(marker, marker + '\n' + live, 1)
          shared.write_text(s, encoding='utf-8')

          index = Path('app/chrome-extension/entrypoints/background/tools/browser/index.ts')
          s = index.read_text(encoding='utf-8')
          if "export { liveViewTool } from './live-view';" not in s:
              s = s.replace("export { screenshotTool } from './screenshot';", "export { screenshotTool } from './screenshot';\nexport { liveViewTool } from './live-view';", 1)
          index.write_text(s, encoding='utf-8')

          relay = Path('app/chrome-extension/entrypoints/background/remote-relay.ts')
          s = relay.read_text(encoding='utf-8')
          imp = "import { stopAllLiveViews } from './tools/browser/live-view';\n"
          if imp not in s:
              s = s.replace("import { releaseAllMouseHolds } from '@/utils/mouse-hold-safety';", imp + "import { releaseAllMouseHolds } from '@/utils/mouse-hold-safety';", 1)
          helper = "function stopLiveViewSafety(reason: string) {\n  const count = stopAllLiveViews(reason);\n  if (count > 0) relayLog('LIVE_VIEW_STOPPED', { reason, count });\n}\n\n"
          marker2 = "function stopWatchSafety(reason: string, notifyPersistence = false) {"
          if helper not in s:
              if marker2 not in s: raise SystemExit('Watch safety marker not found')
              s = s.replace(marker2, helper + marker2, 1)
          s = s.replace("  stopWatchSafety('relay_socket_close_requested');\n  clearHeartbeat();", "  stopWatchSafety('relay_socket_close_requested');\n  stopLiveViewSafety('relay_socket_close_requested');\n  clearHeartbeat();", 1)
          s = s.replace("      stopWatchSafety(reason);\n      clearHeartbeat();", "      stopWatchSafety(reason);\n      stopLiveViewSafety(reason);\n      clearHeartbeat();", 1)
          s = s.replace("      stopWatchSafety('relay_socket_closed');\n      clearHeartbeat();", "      stopWatchSafety('relay_socket_closed');\n      stopLiveViewSafety('relay_socket_closed');\n      clearHeartbeat();", 1)
          manual = "  clearReconnect();\n  await Promise.allSettled(["
          if manual in s:
              s = s.replace(manual, "  clearReconnect();\n  stopLiveViewSafety('manual_relay_disconnect');\n  await Promise.allSettled([", 1)
          relay.write_text(s, encoding='utf-8')

          ep = Path('app/chrome-extension/package.json')
          s = ep.read_text(encoding='utf-8').replace('"version": "2.8.1"', '"version": "2.9.0"', 1)
          ep.write_text(s, encoding='utf-8')

          cp = Path('app/cloudflare-mcp/package.json')
          s = cp.read_text(encoding='utf-8').replace('"version": "0.8.1"', '"version": "0.9.0"', 1)
          cp.write_text(s, encoding='utf-8')

          ci = Path('app/cloudflare-mcp/src/index.ts')
          s = ci.read_text(encoding='utf-8')
          s = s.replace("const BRAUZIO_RUNTIME_VERSION = '2.8.1';", "const BRAUZIO_RUNTIME_VERSION = '2.9.0';", 1)
          s = s.replace("const BRAUZIO_SCHEMA_VERSION = 'v2.8.1-2026-09-07';", "const BRAUZIO_SCHEMA_VERSION = 'v2.9.0-2026-09-07';", 1)
          ci.write_text(s, encoding='utf-8')

          changelog = Path('docs/CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          heading = '# Brauzio Changelog\n\n'
          entry = """## 2026-09-07 — Extension/Cloud V2.9.0 Live View / Stream\n\n- إضافة `chrome_live_view` بإجراءات `start`, `status`, `latest`, `stop`.\n- التقاط متتابع خفيف للتبويب النشط مع interval افتراضي 900ms وحد أدنى آمن 550ms.\n- ضغط JPEG داخل الذاكرة مع scale/quality قابلة للضبط لتقليل النقل.\n- Ring buffer من 1–3 Frames فقط؛ لا Downloads ولا ملفات مؤقتة ولا حفظ على القرص.\n- إرجاع أحدث Frames كـ MCP `image` content لكي يراها الأيجينت مباشرة.\n- إسقاط Frames المتطابقة وتقارير captured/dropped/lastFrameAt.\n- إيقاف تلقائي ومسح الذاكرة عند Navigation أو إغلاق التبويب أو Relay disconnect/error/heartbeat recycle أو خمول الأيجينت 15 ثانية.\n- حماية من تصوير صفحات Chrome/Extension المحمية ومن تصوير تبويب غير نشط بالخطأ.\n\n"""
          if 'V2.9.0 Live View / Stream' not in c:
              if not c.startswith(heading): raise SystemExit('Changelog heading not found')
              c = heading + entry + c[len(heading):]
          changelog.write_text(c, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          section = """\n## Phase 9.5 — Live View / Stream (P1) — Brauzio 2.9.0\n\n- [x] `chrome_live_view` start/status/latest/stop.\n- [x] Memory-only ring buffer (1–3 frames), no Downloads or disk persistence.\n- [x] JPEG compression with configurable interval/scale/quality.\n- [x] Duplicate-frame dropping and capture counters.\n- [x] MCP ImageContent output for direct Agent vision.\n- [x] Auto-stop + memory wipe on navigation, tab close, relay disconnect/error/heartbeat recycle and agent idle timeout.\n- [x] Protected-page and inactive-tab safety.\n- [ ] E2E installed ZIP: run Live View during Wreckmarch movement/drag and confirm sequential visual understanding.\n\n"""
          if '## Phase 9.5 — Live View / Stream' not in r:
              marker3 = '## Phase 10'
              if marker3 in r: r = r.replace(marker3, section + marker3, 1)
              else: r += section
          roadmap.write_text(r, encoding='utf-8')
          PY

      - name: Validate Brauzio 2.9
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build

      - name: Commit validated Brauzio 2.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared/src/tools.ts \
            app/chrome-extension/entrypoints/background/tools/browser/live-view.ts \
            app/chrome-extension/entrypoints/background/tools/browser/index.ts \
            app/chrome-extension/entrypoints/background/remote-relay.ts \
            app/chrome-extension/package.json \
            app/cloudflare-mcp/package.json \
            app/cloudflare-mcp/src/index.ts \
            docs/ROADMAP.md docs/CHANGELOG.md
          git commit -m 'Brauzio 2.9.0 memory-only Live View stream'
          git push
