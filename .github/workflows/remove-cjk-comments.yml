name: Remove CJK comments

on:
  push:
    paths:
      - '.github/workflows/remove-cjk-comments.yml'
      - 'scripts/remove_cjk_comments.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Chinese comments safely
        run: python scripts/remove_cjk_comments.py

      - name: Audit remaining CJK
        run: python scripts/audit_chinese.py

      - name: Show remaining code/text lines
        shell: bash
        run: |
          awk '/## Code\/text lines requiring review/{flag=1;next}/## Comment lines/{flag=0}flag' docs/CHINESE_AUDIT.md | sed -n '1,180p'

      - name: Commit comment cleanup
        shell: bash
        run: |
          git add app/chrome-extension packages docs releases scripts
          git reset scripts/remove_cjk_comments.py docs/CHINESE_AUDIT.md || true
          if git diff --cached --quiet; then
            echo "No comment cleanup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove Chinese comments from Brauzio source"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
