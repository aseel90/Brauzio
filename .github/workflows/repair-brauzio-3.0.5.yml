name: Repair Brauzio 3.0.5 runtime

on:
  push:
    branches:
      - fix/3.0.5-runtime-hardening
    paths:
      - '.github/workflows/repair-brauzio-3.0.5.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.0.5-runtime-hardening
          fetch-depth: 0

      - name: Apply runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          # 1) chrome_javascript: preserve expression return values in CDP and scripting fallback.
          p = Path('app/chrome-extension/entrypoints/background/tools/browser/javascript.ts')
          s = p.read_text(encoding='utf-8')
          old = '''/**
           * Wrap user code in an async IIFE to support top-level await and return statements.
           */
          function wrapUserCode(code: string): string {
            return `(async () => {\\n${code}\\n})()`;
          }
          '''
          new = '''/**
           * Build an async execution wrapper while preserving expression return values.
           * Expression-only input such as `2 + 2`, `document.title`, or `await fetch(...)`
           * returns its value. Statement blocks keep explicit-return semantics.
           */
          function canCompileAsExpression(code: string): boolean {
            try {
              const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
              new AsyncFunction(`return (${code});`);
              return true;
            } catch {
              return false;
            }
          }

          function buildExecutionSource(code: string): { expression: string; functionBody: string } {
            if (canCompileAsExpression(code)) {
              return {
                expression: `(async () => (${code}))()`,
                functionBody: `return (${code});`,
              };
            }
            return {
              expression: `(async () => {\\n${code}\\n})()`,
              functionBody: code,
            };
          }
          '''
          if old not in s:
            raise SystemExit('javascript wrapper source block not found')
          s = s.replace(old, new)
          s = s.replace('const expression = wrapUserCode(code);', 'const { expression } = buildExecutionSource(code);')
          old2 = '''          const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
                    const fn = new AsyncFunction(userCode);
          '''
          new2 = '''          const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
                    let functionBody = userCode;
                    try {
                      new AsyncFunction(`return (${userCode});`);
                      functionBody = `return (${userCode});`;
                    } catch {
                      // Statement block: preserve explicit return semantics.
                    }
                    const fn = new AsyncFunction(functionBody);
          '''
          if old2 not in s:
            raise SystemExit('javascript scripting fallback block not found')
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')

          # 2) chrome_act drag: native HTML5 fast path, physical pointer fallback only when needed.
          p = Path('app/chrome-extension/entrypoints/background/runtime-v3/action-engine.ts')
          s = p.read_text(encoding='utf-8')
          old = '''    const a = await actionabilityService.inspect(tabId, sourceElement, { scroll: true });
              const b = await actionabilityService.inspect(tabId, targetElement, { scroll: true });
              if (!a.center || !b.center) throw this.error('NOT_ACTIONABLE', 'Drag source or target has no visible center');
              const send = (params: object) => this.send(tabId, sourceElement, 'Input.dispatchMouseEvent', params);
              await send({ type: 'mouseMoved', x: a.center.x, y: a.center.y });
              await send({ type: 'mousePressed', x: a.center.x, y: a.center.y, button: 'left', buttons: 1, clickCount: 1 });
              const steps = 8;
              for (let i = 1; i <= steps; i += 1) {
                const t = i / steps;
                await send({ type: 'mouseMoved', x: a.center.x + (b.center.x - a.center.x) * t, y: a.center.y + (b.center.y - a.center.y) * t, button: 'left', buttons: 1 });
              }
              await send({ type: 'mouseReleased', x: b.center.x, y: b.center.y, button: 'left', buttons: 0, clickCount: 1 });
              await this.dispatchHtml5Drag(tabId, sourceElement, targetElement);
          '''
          new = '''    // Standards-based draggable elements use the HTML5 DragEvent/DataTransfer path directly.
              // This avoids the expensive remote mouse sequence while preserving a pointer fallback
              // for sliders, canvases and custom pointer-driven widgets.
              if (await this.isNativeHtml5Draggable(tabId, sourceElement)) {
                await this.dispatchHtml5Drag(tabId, sourceElement, targetElement);
                return;
              }

              const a = await actionabilityService.inspect(tabId, sourceElement, { scroll: true, stableMs: 40 });
              const b = await actionabilityService.inspect(tabId, targetElement, { scroll: true, stableMs: 40 });
              if (!a.center || !b.center) throw this.error('NOT_ACTIONABLE', 'Drag source or target has no visible center');
              const send = (params: object) => this.send(tabId, sourceElement, 'Input.dispatchMouseEvent', params);
              await send({ type: 'mouseMoved', x: a.center.x, y: a.center.y });
              await send({ type: 'mousePressed', x: a.center.x, y: a.center.y, button: 'left', buttons: 1, clickCount: 1 });
              const steps = 4;
              for (let i = 1; i <= steps; i += 1) {
                const t = i / steps;
                await send({ type: 'mouseMoved', x: a.center.x + (b.center.x - a.center.x) * t, y: a.center.y + (b.center.y - a.center.y) * t, button: 'left', buttons: 1 });
              }
              await send({ type: 'mouseReleased', x: b.center.x, y: b.center.y, button: 'left', buttons: 0, clickCount: 1 });
          '''
          if old not in s:
            raise SystemExit('drag implementation block not found')
          s = s.replace(old, new)
          marker = '''  private async dispatchHtml5Drag(tabId: number, sourceElement: V3Element, targetElement: V3Element): Promise<void> {'''
          helper = '''  private async isNativeHtml5Draggable(tabId: number, sourceElement: V3Element): Promise<boolean> {
              const objectGroup = `brauzio-v3-drag-detect:${tabId}`;
              const resolved = await this.send<any>(tabId, sourceElement, 'DOM.resolveNode', {
                backendNodeId: sourceElement.backendNodeId,
                objectGroup,
              }).catch(() => undefined);
              const objectId = resolved?.object?.objectId;
              if (!objectId) return false;
              try {
                const result = await this.send<any>(tabId, sourceElement, 'Runtime.callFunctionOn', {
                  objectId,
                  returnByValue: true,
                  functionDeclaration: `function(){
                    const el=this;
                    return Boolean(el && (el.draggable === true || el.getAttribute?.('draggable') === 'true'));
                  }`,
                }).catch(() => undefined);
                return Boolean(result?.result?.value);
              } finally {
                await this.send(tabId, sourceElement, 'Runtime.releaseObjectGroup', { objectGroup }).catch(() => undefined);
              }
            }

          '''
          if marker not in s:
            raise SystemExit('HTML5 drag marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Version alignment: extension + Worker serverInfo/schema.
          p = Path('app/chrome-extension/package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = '3.0.5'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('app/cloudflare-mcp/src/index.ts')
          s = p.read_text(encoding='utf-8').replace("const BRAUZIO_RUNTIME_VERSION = '3.0.4';", "const BRAUZIO_RUNTIME_VERSION = '3.0.5';").replace("const BRAUZIO_SCHEMA_VERSION = '3.0.4';", "const BRAUZIO_SCHEMA_VERSION = '3.0.5';")
          p.write_text(s, encoding='utf-8')

          # 4) Permanent regression guards in CI for the exact failure classes found live.
          p = Path('.github/workflows/brauzio-ci.yml')
          s = p.read_text(encoding='utf-8')
          anchor = '''      - name: Build Chrome extension
                  run: pnpm --filter brauzio-extension build
          '''
          guard = '''      - name: Runtime regression guards
                  shell: bash
                  run: |
                    set -euo pipefail
                    JS='app/chrome-extension/entrypoints/background/tools/browser/javascript.ts'
                    ACT='app/chrome-extension/entrypoints/background/runtime-v3/action-engine.ts'
                    grep -Fq 'buildExecutionSource(code)' "$JS"
                    grep -Fq 'functionBody = `return (${userCode});`' "$JS"
                    grep -Fq 'isNativeHtml5Draggable' "$ACT"
                    grep -Fq 'await this.dispatchHtml5Drag(tabId, sourceElement, targetElement);' "$ACT"
                    grep -Fq 'const steps = 4;' "$ACT"
                    echo 'Runtime regression guards passed: JS result propagation + HTML5 drag fast path.'

                - name: Build Chrome extension
                  run: pnpm --filter brauzio-extension build
          '''
          if anchor not in s:
            raise SystemExit('CI build anchor not found')
          s = s.replace(anchor, guard, 1)
          p.write_text(s, encoding='utf-8')

          # Keep deployment metadata current.
          p = Path('.github/workflows/deploy-cloudflare.yml')
          s = p.read_text(encoding='utf-8').replace('# Brauzio 3.0.2 runtime deployment trigger', '# Brauzio 3.0.5 runtime deployment trigger')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate repair before commit
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build

      - name: Commit repaired 3.0.5 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-brauzio-3.0.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Brauzio 3.0.5 runtime and regressions'
          git push origin HEAD:fix/3.0.5-runtime-hardening
