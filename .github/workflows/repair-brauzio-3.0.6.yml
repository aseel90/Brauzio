name: Repair Brauzio 3.0.6 Runtime Integrity

on:
  push:
    branches:
      - fix/3.0.6-runtime-integrity
    paths:
      - '.github/workflows/repair-brauzio-3.0.6.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/3.0.6-runtime-integrity

      - name: Apply 3.0.6 runtime integrity patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          js = Path('app/chrome-extension/entrypoints/background/tools/browser/javascript.ts')
          text = js.read_text(encoding='utf-8')
          start = text.index('/**\n * Build an async execution wrapper')
          end = text.index('// ============================================================================\n// CDP Execution', start)
          replacement = '''/**
           * Build the evaluator entirely as page-side JavaScript source.
           * Chrome parses this source natively inside Runtime.evaluate, avoiding
           * async-function constructor changes introduced by extension transpilation.
           */
          const BRAUZIO_JS_RUNTIME = 'BRAUZIO_JS_RUNTIME_V3';

          function buildRuntimeEvaluatorSource(code: string): string {
            const encodedCode = JSON.stringify(code);
            return `(async (userCode) => {
              const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
              let fn;
              try {
                fn = new AsyncFunction('return (' + userCode + ');');
              } catch {
                fn = new AsyncFunction(userCode);
              }
              return await fn();
            })(${encodedCode})`;
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('const { expression } = buildExecutionSource(code);', 'const expression = buildRuntimeEvaluatorSource(code);')
          text = text.replace('  engine: ExecutionEngine;\n  result?: string;', '  engine: ExecutionEngine;\n  extensionVersion?: string;\n  runtime?: string;\n  result?: string;')
          text = text.replace('      engine: result.engine,\n      result: result.output,', "      engine: result.engine,\n      extensionVersion: chrome.runtime.getManifest().version,\n      runtime: BRAUZIO_JS_RUNTIME,\n      result: result.output,")
          text = text.replace('      engine: result.engine,\n      error: result.error,', "      engine: result.engine,\n      extensionVersion: chrome.runtime.getManifest().version,\n      runtime: BRAUZIO_JS_RUNTIME,\n      error: result.error,")
          js.write_text(text, encoding='utf-8')

          window = Path('app/chrome-extension/entrypoints/background/tools/browser/window.ts')
          text = window.read_text(encoding='utf-8')
          text = text.replace('      const result = {\n        windowCount: windows.length,', "      const result = {\n        runtime: {\n          extensionVersion: chrome.runtime.getManifest().version,\n          buildId: 'BRAUZIO_BUILD_3_0_6',\n        },\n        windowCount: windows.length,")
          window.write_text(text, encoding='utf-8')

          pkg = Path('app/chrome-extension/package.json')
          text = pkg.read_text(encoding='utf-8').replace('"version": "3.0.5"', '"version": "3.0.6"')
          pkg.write_text(text, encoding='utf-8')

          worker = Path('app/cloudflare-mcp/src/index.ts')
          text = worker.read_text(encoding='utf-8')
          text = text.replace("const BRAUZIO_RUNTIME_VERSION = '3.0.5';", "const BRAUZIO_RUNTIME_VERSION = '3.0.6';")
          text = text.replace("const BRAUZIO_SCHEMA_VERSION = '3.0.5';", "const BRAUZIO_SCHEMA_VERSION = '3.0.6';")
          worker.write_text(text, encoding='utf-8')

          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare WXT types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared schemas
        run: pnpm --filter brauzio-shared build

      - name: Typecheck Worker
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Build Worker
        run: pnpm --filter brauzio-cloud-mcp build

      - name: Functional test page-side evaluator source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const build = (code) => {
            const encodedCode = JSON.stringify(code);
            return `(async (userCode) => {
              const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
              let fn;
              try { fn = new AsyncFunction('return (' + userCode + ');'); }
              catch { fn = new AsyncFunction(userCode); }
              return await fn();
            })(${encodedCode})`;
          };
          (async () => {
            const a = await eval(build('2+2'));
            const b = await eval(build('const x=3; return x*2;'));
            const c = await eval(build('await Promise.resolve(7)'));
            if (a !== 4 || b !== 6 || c !== 7) throw new Error(`evaluator failed: ${a},${b},${c}`);
            console.log('Page-side evaluator functional test passed:', a, b, c);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Build extension
        run: pnpm --filter brauzio-extension build

      - name: Verify built runtime, version and drag guards
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          root = Path('app/chrome-extension/.output/chrome-mv3')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '3.0.6', manifest['version']
          bg = (root / 'background.js').read_text(encoding='utf-8')
          assert 'BRAUZIO_JS_RUNTIME_V3' in bg
          assert 'BRAUZIO_BUILD_3_0_6' in bg
          action = Path('app/chrome-extension/entrypoints/background/runtime-v3/action-engine.ts').read_text(encoding='utf-8')
          assert 'isNativeHtml5Draggable' in action
          assert 'const steps = 4;' in action
          print('3.0.6 built-runtime integrity checks passed')
          PY

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chrome-extension app/cloudflare-mcp/src/index.ts
          git commit -m 'fix: Brauzio 3.0.6 runtime integrity and version diagnostics'
          git push
