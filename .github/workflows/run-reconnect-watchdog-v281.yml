name: Run Brauzio Reconnect Watchdog V281

on:
  push:
    branches: [reconnect-watchdog-v281]
    paths:
      - '.github/workflows/run-reconnect-watchdog-v281.yml'
      - 'scripts/apply-reconnect-watchdog-v281.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: python scripts/apply-reconnect-watchdog-v281.py
      - name: Validate full Brauzio build
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build
      - name: Commit validated watchdog source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chrome-extension/entrypoints/background/remote-relay.ts
          if git diff --cached --quiet; then
            echo 'No production diff produced'
            exit 1
          fi
          git commit -m 'Add Relay heartbeat reconnect watchdog [skip ci]'
          git push
