name: Brauzio 3.0.3 Screenshot Patch

on:
  push:
    paths:
      - '.github/workflows/screenshot-v303.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch screenshot transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/chrome-extension/entrypoints/background/tools/browser/screenshot.ts')
          s = p.read_text()
          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing {label}')
              s = s.replace(old, new, 1)

          one('  savePng?: boolean;\n', '  savePng?: boolean;\n  returnImage?: boolean;\n', 'interface')
          one("      storeBase64 = false,\n      fullPage = false,\n      savePng = true,\n",
              "      storeBase64 = false,\n      fullPage = false,\n      savePng = false,\n      returnImage = true,\n", 'defaults')
          one("    let finalImageDataUrl: string | undefined;\n    let finalImageWidthCss: number | undefined;\n    let finalImageHeightCss: number | undefined;\n",
              "    let finalImageDataUrl: string | undefined;\n    let finalImageWidthCss: number | undefined;\n    let finalImageHeightCss: number | undefined;\n    let transportDataUrl = '';\n    let transportMimeType = 'image/png';\n    let transportBase64 = '';\n", 'transport vars')

          old = '''      if (storeBase64 === true) {
                // Compress image for base64 output to reduce size
                const compressed = await compressImage(finalImageDataUrl, {
                  scale: 0.7, // Reduce dimensions by 30%
                  quality: 0.8, // 80% quality for good balance
                  format: 'image/jpeg', // JPEG for better compression
                });

                // Include base64 data in response (without prefix)
                const base64Data = compressed.dataUrl.replace(/^data:image\\/[^;]+;base64,/, '');
                results.base64 = base64Data;
                return {
                  content: [
                    {
                      type: 'text',
                      text: JSON.stringify({ base64Data, mimeType: compressed.mimeType }),
                    },
                  ],
                  isError: false,
                };
              }

              if (savePng === true) {'''
          new = '''      transportDataUrl = finalImageDataUrl;
              transportMimeType = finalImageDataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : 'image/png';
              let compressionFallback = false;
              if (returnImage !== false || storeBase64 === true) {
                try {
                  const compressed = await compressImage(finalImageDataUrl, {
                    scale: 0.7,
                    quality: 0.8,
                    format: 'image/jpeg',
                  });
                  transportDataUrl = compressed.dataUrl;
                  transportMimeType = compressed.mimeType;
                } catch (compressionError) {
                  compressionFallback = true;
                  console.warn('Screenshot JPEG compression failed; returning original image:', compressionError);
                }
              }
              transportBase64 = transportDataUrl.replace(/^data:image\\/[^;]+;base64,/, '');
              if (storeBase64 === true) {
                results.base64 = transportBase64;
                results.mimeType = transportMimeType;
              }
              results.compressionFallback = compressionFallback;

              if (savePng === true) {'''
          one(old, new, 'transport block')

          old = '''    return {
              content: [
                {
                  type: 'text',
                  text: JSON.stringify({
                    success: true,
                    message: `Screenshot [${name}] captured successfully`,
                    tabId: tab.id,
                    url: tab.url,
                    name: name,
                    ...results,
                  }),
                },
              ],
              isError: false,
            };'''
          new = '''    const content: any[] = [
              {
                type: 'text',
                text: JSON.stringify({
                  success: true,
                  message: `Screenshot [${name}] captured successfully`,
                  tabId: tab.id,
                  url: tab.url,
                  name: name,
                  ...results,
                }),
              },
            ];
            if (returnImage !== false) {
              content.push({ type: 'image', data: transportBase64, mimeType: transportMimeType });
            }
            return { content, isError: false };'''
          one(old, new, 'MCP image return')
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/screenshot-v303.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: return screenshots as MCP images by default'
          git push
