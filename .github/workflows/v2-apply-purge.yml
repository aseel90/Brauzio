name: Brauzio V2 verified purge

on:
  push:
    branches: [v2-ci-probe]
    paths:
      - '.github/workflows/v2-apply-purge.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  purge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-ci-probe
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Remove legacy product layers
        shell: bash
        run: |
          rm -rf \
            app/chrome-extension/entrypoints/background/element-marker \
            app/chrome-extension/entrypoints/background/record-replay \
            app/chrome-extension/entrypoints/background/record-replay-v3 \
            app/chrome-extension/entrypoints/background/web-editor \
            app/chrome-extension/entrypoints/background/utils \
            app/chrome-extension/entrypoints/sidepanel \
            app/chrome-extension/entrypoints/web-editor-v2 \
            app/chrome-extension/entrypoints/shared \
            app/chrome-extension/entrypoints/popup/components/builder \
            app/chrome-extension/shared/quick-panel \
            app/chrome-extension/shared/selector \
            app/chrome-extension/tests \
            app/chrome-extension/entrypoints/styles

          rm -f \
            app/chrome-extension/common/element-marker-types.ts \
            app/chrome-extension/common/web-editor-types.ts \
            app/chrome-extension/entrypoints/offscreen/rr-keepalive.ts \
            app/chrome-extension/inject-scripts/dom-observer.js \
            app/chrome-extension/inject-scripts/element-marker.js \
            app/chrome-extension/inject-scripts/props-agent.js \
            app/chrome-extension/inject-scripts/recorder.js \
            app/chrome-extension/inject-scripts/web-editor.js \
            app/chrome-extension/utils/content-indexer.ts \
            app/chrome-extension/utils/indexeddb-client.ts \
            app/chrome-extension/utils/lru-cache.ts \
            app/chrome-extension/utils/model-cache-manager.ts \
            app/chrome-extension/utils/semantic-similarity-engine.ts \
            app/chrome-extension/utils/simd-math-engine.ts \
            app/chrome-extension/utils/text-chunker.ts \
            app/chrome-extension/utils/vector-database.ts \
            app/chrome-extension/tailwind.config.ts \
            app/chrome-extension/vitest.config.ts

      - name: Apply V2 runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new))

          replace(
              'app/chrome-extension/entrypoints/background/tools/browser/computer.ts',
              'func: async (text, shouldAppear, timeoutMs) =>',
              'func: async (text: string, shouldAppear: boolean, timeoutMs: number) =>',
          )

          replace(
              'app/chrome-extension/entrypoints/background/tools/browser/network-capture-web-request.ts',
              "private listeners: { [key: string]: (details: any) => void } = {};",
              "private listeners: Partial<Record<string, (details: any) => void>> = {};",
          )

          replace(
              'app/chrome-extension/entrypoints/background/tools/browser/gif-recorder.ts',
              "const blob = new Blob([stopResult.gifData], { type: 'image/gif' });",
              "const gifBuffer = new ArrayBuffer(stopResult.gifData.byteLength);\n            new Uint8Array(gifBuffer).set(stopResult.gifData);\n            const blob = new Blob([gifBuffer], { type: 'image/gif' });",
          )
          replace(
              'app/chrome-extension/entrypoints/background/tools/browser/gif-recorder.ts',
              "const blob = new Blob([lastRecordedGif.gifData], { type: 'image/gif' });",
              "const gifBuffer = new ArrayBuffer(lastRecordedGif.gifData.byteLength);\n            new Uint8Array(gifBuffer).set(lastRecordedGif.gifData);\n            const blob = new Blob([gifBuffer], { type: 'image/gif' });",
          )

          replace(
              'app/chrome-extension/entrypoints/offscreen/gif-encoder.ts',
              "  const gifTypes = [\n    OFFSCREEN_MESSAGE_TYPES.GIF_ADD_FRAME,\n    OFFSCREEN_MESSAGE_TYPES.GIF_FINISH,\n    OFFSCREEN_MESSAGE_TYPES.GIF_RESET,\n  ];\n\n  return gifTypes.includes(msg.type as string);",
              "  const gifTypes = new Set<string>([\n    OFFSCREEN_MESSAGE_TYPES.GIF_ADD_FRAME,\n    OFFSCREEN_MESSAGE_TYPES.GIF_FINISH,\n    OFFSCREEN_MESSAGE_TYPES.GIF_RESET,\n  ]);\n\n  return gifTypes.has(String(msg.type));",
          )

          welcome = Path('app/chrome-extension/entrypoints/welcome/App.vue')
          s = welcome.read_text()
          s = s.replace("const copied = ref(false);", "const copied = ref(false);\nconst version = chrome.runtime.getManifest().version;")
          s = s.replace("Brauzio v{{ chrome.runtime.getManifest().version }}", "Brauzio v{{ version }}")
          welcome.write_text(s)

          package = Path('app/chrome-extension/package.json')
          data = json.loads(package.read_text())
          for dep in ['jsdom', 'vitest']:
              data.get('devDependencies', {}).pop(dep, None)
          data.get('scripts', {}).pop('test', None)
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > app/chrome-extension/entrypoints/background/tools/browser/history.ts <<'EOF'
          import { createErrorResponse, type ToolResult } from '@/common/tool-handler';
          import { BaseBrowserToolExecutor } from '../base-browser';
          import { TOOL_NAMES } from 'brauzio-shared';

          interface HistoryToolParams {
            text?: string;
            startTime?: string;
            endTime?: string;
            maxResults?: number;
            excludeCurrentTabs?: boolean;
          }

          class HistoryTool extends BaseBrowserToolExecutor {
            name = TOOL_NAMES.BROWSER.HISTORY;
            private static readonly DAY_MS = 24 * 60 * 60 * 1000;

            private startOfDay(offsetDays = 0): number {
              const d = new Date();
              d.setHours(0, 0, 0, 0);
              d.setDate(d.getDate() + offsetDays);
              return d.getTime();
            }

            private parseDateString(value?: string): number | null {
              if (!value) return null;
              const input = value.trim();
              const lower = input.toLowerCase();
              if (lower === 'now') return Date.now();
              if (lower === 'today') return this.startOfDay(0);
              if (lower === 'yesterday') return this.startOfDay(-1);

              const relative = lower.match(/^(\d+)\s+(day|days|week|weeks|month|months|year|years)\s+ago$/);
              if (relative) {
                const amount = Number(relative[1]);
                const unit = relative[2];
                const d = new Date();
                if (unit.startsWith('day')) d.setDate(d.getDate() - amount);
                else if (unit.startsWith('week')) d.setDate(d.getDate() - amount * 7);
                else if (unit.startsWith('month')) d.setMonth(d.getMonth() - amount);
                else d.setFullYear(d.getFullYear() - amount);
                return d.getTime();
              }

              const parsed = new Date(input);
              const timestamp = parsed.getTime();
              return Number.isFinite(timestamp) ? timestamp : null;
            }

            private formatDate(timestamp: number): string {
              const d = new Date(timestamp);
              const pad = (n: number) => String(n).padStart(2, '0');
              return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            }

            async execute(args: HistoryToolParams): Promise<ToolResult> {
              try {
                const text = args?.text ?? '';
                const maxResults = Math.max(1, Math.min(Number(args?.maxResults ?? 100), 1000));
                const now = Date.now();
                const parsedStart = args?.startTime ? this.parseDateString(args.startTime) : now - HistoryTool.DAY_MS;
                const parsedEnd = args?.endTime ? this.parseDateString(args.endTime) : now;

                if (parsedStart === null) return createErrorResponse(`Invalid startTime: ${args.startTime}`);
                if (parsedEnd === null) return createErrorResponse(`Invalid endTime: ${args.endTime}`);
                if (parsedStart > parsedEnd) return createErrorResponse('Start time cannot be after end time.');

                let items = await chrome.history.search({ text, startTime: parsedStart, endTime: parsedEnd, maxResults });

                if (args?.excludeCurrentTabs && items.length) {
                  const openUrls = new Set((await chrome.tabs.query({})).map((tab) => tab.url).filter((url): url is string => !!url));
                  items = items.filter((item) => !item.url || !openUrls.has(item.url));
                }

                const result = {
                  items: items.map((item) => ({
                    id: item.id,
                    url: item.url,
                    title: item.title,
                    lastVisitTime: item.lastVisitTime,
                    visitCount: item.visitCount,
                    typedCount: item.typedCount,
                  })),
                  totalCount: items.length,
                  timeRange: {
                    startTime: parsedStart,
                    endTime: parsedEnd,
                    startTimeFormatted: this.formatDate(parsedStart),
                    endTimeFormatted: this.formatDate(parsedEnd),
                  },
                  ...(text ? { query: text } : {}),
                };

                return { content: [{ type: 'text', text: JSON.stringify(result, null, 2) }], isError: false };
              } catch (error) {
                return createErrorResponse(`Error retrieving browsing history: ${error instanceof Error ? error.message : String(error)}`);
              }
            }
          }

          export const historyTool = new HistoryTool();
          EOF

          cat > app/chrome-extension/entrypoints/background/tools/browser/read-page.ts <<'EOF'
          import { createErrorResponse, type ToolResult } from '@/common/tool-handler';
          import { BaseBrowserToolExecutor } from '../base-browser';
          import { TOOL_NAMES } from 'brauzio-shared';
          import { TOOL_MESSAGE_TYPES } from '@/common/message-types';
          import { ERROR_MESSAGES } from '@/common/constants';

          interface ReadPageParams {
            filter?: 'interactive';
            depth?: number;
            refId?: string;
            tabId?: number;
            windowId?: number;
          }

          interface ReadPageStats {
            processed: number;
            included: number;
            durationMs: number;
          }

          class ReadPageTool extends BaseBrowserToolExecutor {
            name = TOOL_NAMES.BROWSER.READ_PAGE;

            async execute(args: ReadPageParams): Promise<ToolResult> {
              const { filter, depth, refId } = args || {};
              const focusRefId = typeof refId === 'string' ? refId.trim() : '';
              if (refId !== undefined && !focusRefId) {
                return createErrorResponse(`${ERROR_MESSAGES.INVALID_PARAMETERS}: refId must be a non-empty string`);
              }

              const requestedDepth = depth === undefined ? undefined : Number(depth);
              if (requestedDepth !== undefined && (!Number.isInteger(requestedDepth) || requestedDepth < 0)) {
                return createErrorResponse(`${ERROR_MESSAGES.INVALID_PARAMETERS}: depth must be a non-negative integer`);
              }

              const userControlled = requestedDepth !== undefined || !!focusRefId;

              try {
                const tab = (await this.tryGetTab(args?.tabId)) || (await this.getActiveTabOrThrowInWindow(args?.windowId));
                if (!tab.id) return createErrorResponse(`${ERROR_MESSAGES.TAB_NOT_FOUND}: Active tab has no ID`);

                await this.injectContentScript(tab.id, ['inject-scripts/accessibility-tree-helper.js'], false, 'ISOLATED', true);
                const resp = await this.sendMessageToTab(tab.id, {
                  action: TOOL_MESSAGE_TYPES.GENERATE_ACCESSIBILITY_TREE,
                  filter: filter || null,
                  depth: requestedDepth,
                  refId: focusRefId || undefined,
                });

                const treeOk = resp?.success === true;
                const pageContent = typeof resp?.pageContent === 'string' ? resp.pageContent : '';
                const stats: ReadPageStats = treeOk && resp?.stats
                  ? {
                      processed: Number(resp.stats.processed ?? 0),
                      included: Number(resp.stats.included ?? 0),
                      durationMs: Number(resp.stats.durationMs ?? 0),
                    }
                  : { processed: 0, included: 0, durationMs: 0 };
                const lines = pageContent ? pageContent.split('\n').filter((line: string) => line.trim()).length : 0;
                const refCount = Array.isArray(resp?.refMap) ? resp.refMap.length : 0;
                const isSparse = !userControlled && lines < 10 && refCount < 3;

                const payload: Record<string, unknown> = {
                  success: true,
                  filter: filter || 'all',
                  pageContent,
                  tips: "If a target is missing, use screenshot to inspect its on-screen coordinates, then interact by ref or coordinates.",
                  viewport: treeOk ? resp.viewport : { width: null, height: null, dpr: null },
                  stats,
                  refMapCount: refCount,
                  sparse: treeOk ? isSparse : false,
                  depth: requestedDepth ?? null,
                  focus: focusRefId ? { refId: focusRefId, found: treeOk } : null,
                  elements: [],
                  count: 0,
                  fallbackUsed: false,
                  fallbackSource: null,
                  reason: null,
                };

                if (treeOk && !isSparse) {
                  return { content: [{ type: 'text', text: JSON.stringify(payload) }], isError: false };
                }
                if (focusRefId) return createErrorResponse(resp?.error || `refId "${focusRefId}" not found or expired`);
                if (requestedDepth !== undefined) return createErrorResponse(resp?.error || 'Failed to generate accessibility tree');

                try {
                  await this.injectContentScript(tab.id, ['inject-scripts/interactive-elements-helper.js']);
                  const fallback = await this.sendMessageToTab(tab.id, {
                    action: TOOL_MESSAGE_TYPES.GET_INTERACTIVE_ELEMENTS,
                    includeCoordinates: true,
                  });
                  if (fallback?.success && Array.isArray(fallback.elements)) {
                    const elements = fallback.elements.slice(0, 150);
                    payload.fallbackUsed = true;
                    payload.fallbackSource = 'get_interactive_elements';
                    payload.reason = treeOk ? 'sparse_tree' : resp?.error || 'tree_failed';
                    payload.elements = elements;
                    payload.count = fallback.elements.length;
                    if (!pageContent) {
                      payload.pageContent = elements.map((element: any) => {
                        const type = typeof element?.type === 'string' ? element.type : 'element';
                        const text = typeof element?.text === 'string' && element.text.trim()
                          ? ` "${element.text.trim().replace(/\s+/g, ' ').slice(0, 100).replace(/"/g, '\\"')}"`
                          : '';
                        const selector = typeof element?.selector === 'string' && element.selector ? ` selector="${element.selector}"` : '';
                        const coords = element?.coordinates && Number.isFinite(element.coordinates.x) && Number.isFinite(element.coordinates.y)
                          ? ` (x=${Math.round(element.coordinates.x)},y=${Math.round(element.coordinates.y)})`
                          : '';
                        return `- ${type}${text}${selector}${coords}`;
                      }).join('\n');
                    }
                    return { content: [{ type: 'text', text: JSON.stringify(payload) }], isError: false };
                  }
                } catch (error) {
                  console.warn('[Brauzio] read_page fallback failed', error);
                }

                return createErrorResponse(treeOk ? 'Accessibility tree is too sparse and fallback failed' : resp?.error || 'Failed to generate accessibility tree');
              } catch (error) {
                return createErrorResponse(`Error generating accessibility tree: ${error instanceof Error ? error.message : String(error)}`);
              }
            }
          }

          export const readPageTool = new ReadPageTool();
          EOF

          cat > app/chrome-extension/shared/element-picker/controller.ts <<'EOF'
          import type { PickedElement } from 'brauzio-shared';

          export interface ElementPickerControllerOptions {
            hostId?: string;
            zIndex?: number;
            onCancel?: () => void;
            onConfirm?: () => void;
            onSetActiveRequest?: (requestId: string) => void;
            onClearSelection?: (requestId: string) => void;
          }

          export interface ElementPickerController {
            show: (state: ElementPickerUiState) => void;
            update: (patch: ElementPickerUiPatch) => void;
            hide: () => void;
            isVisible: () => boolean;
            dispose: () => void;
          }

          export interface ElementPickerUiRequest {
            id: string;
            name: string;
            description?: string;
          }

          export interface ElementPickerUiState {
            sessionId: string;
            requests: ElementPickerUiRequest[];
            activeRequestId: string | null;
            selections: Record<string, PickedElement | null>;
            deadlineTs: number;
            errorMessage: string | null;
          }

          export type ElementPickerUiPatch = Partial<Omit<ElementPickerUiState, 'sessionId'>> & { sessionId: string };

          const STYLES = `
            :host{all:initial;color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
            *{box-sizing:border-box}
            .wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:18px;pointer-events:none}
            .panel{width:min(430px,calc(100vw - 36px));max-height:min(620px,calc(100vh - 36px));overflow:auto;pointer-events:auto;background:#fff;color:#101828;border:1px solid #e4e7ec;border-radius:18px;box-shadow:0 22px 60px rgba(16,24,40,.22);direction:rtl}
            .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 17px;border-bottom:1px solid #eaecf0}
            .brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:2px;color:#667085;font-size:11px}
            .timer{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6941c6;background:#f4f3ff;border:1px solid #d9d6fe;border-radius:999px;padding:5px 9px;direction:ltr}
            .body{padding:14px}.hint{margin:0 0 12px;color:#667085;font-size:12px;line-height:1.7}.error{margin-bottom:10px;padding:9px 10px;background:#fef3f2;color:#b42318;border:1px solid #fecdca;border-radius:10px;font-size:12px}
            .list{display:grid;gap:9px}.item{padding:11px;border:1px solid #eaecf0;border-radius:12px;background:#fcfcfd}.item.active{border-color:#9b8afb;box-shadow:0 0 0 2px #f4f3ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:13px;font-weight:700}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#475467}.badge.selected{background:#ecfdf3;color:#027a48}.badge.active{background:#f4f3ff;color:#6941c6}.desc{margin-top:5px;color:#667085;font-size:11px;line-height:1.6}.picked{margin-top:8px;padding:8px;border-radius:9px;background:#f9fafb;color:#344054;font-size:11px;word-break:break-word;direction:ltr;text-align:left}.actions{display:flex;gap:7px;margin-top:9px}
            button{appearance:none;border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:9px;padding:7px 10px;font:600 11px inherit;cursor:pointer}button:hover{background:#f9fafb}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#5b5bd6;border-color:#5b5bd6;color:#fff}.primary:hover{background:#4a4ac3}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid #eaecf0}.progress{color:#667085;font-size:11px}.foot-actions{display:flex;gap:8px}
          `;

          function countdown(deadlineTs: number): string {
            const seconds = Math.max(0, Math.floor((deadlineTs - Date.now()) / 1000));
            return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
          }

          function truncate(value: string, max = 100): string {
            const text = String(value || '').trim().replace(/\s+/g, ' ');
            return text.length <= max ? text : `${text.slice(0, max - 1)}…`;
          }

          export function createElementPickerController(options: ElementPickerControllerOptions = {}): ElementPickerController {
            const hostId = options.hostId ?? '__brauzio_element_picker_host__';
            const zIndex = options.zIndex ?? 2147483647;
            let host: HTMLDivElement | null = null;
            let shadow: ShadowRoot | null = null;
            let root: HTMLDivElement | null = null;
            let state: ElementPickerUiState | null = null;
            let timer: ReturnType<typeof setInterval> | null = null;
            let disposed = false;

            const onKey = (event: KeyboardEvent) => {
              if (event.key !== 'Escape' || !state) return;
              event.preventDefault();
              event.stopPropagation();
              options.onCancel?.();
            };

            function ensureMounted() {
              if (host && shadow && root) return;
              host = document.createElement('div');
              host.id = hostId;
              host.style.cssText = `position:fixed;inset:0;z-index:${zIndex};pointer-events:none`;
              shadow = host.attachShadow({ mode: 'open' });
              const style = document.createElement('style');
              style.textContent = STYLES;
              root = document.createElement('div');
              shadow.append(style, root);
              (document.documentElement || document.body).append(host);
              window.addEventListener('keydown', onKey, true);
            }

            function render() {
              if (!root || !state) return;
              root.innerHTML = '';
              const wrap = document.createElement('div');
              wrap.className = 'wrap';
              const panel = document.createElement('section');
              panel.className = 'panel';
              panel.setAttribute('role', 'dialog');
              panel.setAttribute('aria-label', 'اختيار عناصر Brauzio');

              const head = document.createElement('header');
              head.className = 'head';
              const brand = document.createElement('div');
              brand.className = 'brand';
              brand.innerHTML = '<strong>Brauzio — اختيار العناصر</strong><span>حدد العناصر المطلوبة مباشرة من الصفحة</span>';
              const timerEl = document.createElement('span');
              timerEl.className = 'timer';
              timerEl.dataset.role = 'timer';
              timerEl.textContent = countdown(state.deadlineTs);
              head.append(brand, timerEl);

              const body = document.createElement('div');
              body.className = 'body';
              const hint = document.createElement('p');
              hint.className = 'hint';
              hint.textContent = 'اختر كل عنصر طلبه ChatGPT، ثم اضغط تأكيد. يمكنك الضغط على Esc للإلغاء.';
              body.append(hint);
              if (state.errorMessage) {
                const error = document.createElement('div');
                error.className = 'error';
                error.textContent = state.errorMessage;
                body.append(error);
              }

              const list = document.createElement('div');
              list.className = 'list';
              let selectedCount = 0;
              for (const request of state.requests) {
                const picked = state.selections[request.id] || null;
                const active = state.activeRequestId === request.id;
                if (picked) selectedCount++;
                const item = document.createElement('article');
                item.className = `item${active ? ' active' : ''}`;
                const row = document.createElement('div');
                row.className = 'row';
                const title = document.createElement('span');
                title.className = 'title';
                title.textContent = request.name;
                const badge = document.createElement('span');
                badge.className = `badge${picked ? ' selected' : active ? ' active' : ''}`;
                badge.textContent = picked ? 'تم الاختيار' : active ? 'اختر الآن' : 'بانتظارك';
                row.append(title, badge);
                item.append(row);
                if (request.description) {
                  const desc = document.createElement('div');
                  desc.className = 'desc';
                  desc.textContent = request.description;
                  item.append(desc);
                }
                if (picked) {
                  const info = document.createElement('div');
                  info.className = 'picked';
                  info.textContent = `${picked.tagName || 'element'} • ref=${picked.ref} • ${truncate(picked.text || picked.selector || '')}`;
                  item.append(info);
                }
                const actions = document.createElement('div');
                actions.className = 'actions';
                const pick = document.createElement('button');
                pick.type = 'button';
                pick.textContent = active ? 'جارٍ الاختيار…' : 'اختيار';
                pick.disabled = active;
                pick.addEventListener('click', () => options.onSetActiveRequest?.(request.id));
                const clear = document.createElement('button');
                clear.type = 'button';
                clear.textContent = 'مسح';
                clear.disabled = !picked;
                clear.addEventListener('click', () => options.onClearSelection?.(request.id));
                actions.append(pick, clear);
                item.append(actions);
                list.append(item);
              }
              body.append(list);

              const foot = document.createElement('footer');
              foot.className = 'foot';
              const progress = document.createElement('span');
              progress.className = 'progress';
              progress.textContent = `${selectedCount}/${state.requests.length} تم اختيارها`;
              const footActions = document.createElement('div');
              footActions.className = 'foot-actions';
              const cancel = document.createElement('button');
              cancel.type = 'button';
              cancel.textContent = 'إلغاء';
              cancel.addEventListener('click', () => options.onCancel?.());
              const confirm = document.createElement('button');
              confirm.type = 'button';
              confirm.className = 'primary';
              confirm.textContent = 'تأكيد';
              confirm.disabled = selectedCount !== state.requests.length;
              confirm.addEventListener('click', () => options.onConfirm?.());
              footActions.append(cancel, confirm);
              foot.append(progress, footActions);

              panel.append(head, body, foot);
              wrap.append(panel);
              root.append(wrap);
            }

            function updateTimer() {
              const timerEl = shadow?.querySelector<HTMLElement>('[data-role="timer"]');
              if (timerEl && state) timerEl.textContent = countdown(state.deadlineTs);
            }

            function clearTimer() {
              if (timer !== null) clearInterval(timer);
              timer = null;
            }

            function show(next: ElementPickerUiState) {
              if (disposed) return;
              ensureMounted();
              state = next;
              render();
              clearTimer();
              timer = setInterval(updateTimer, 500);
            }

            function update(patch: ElementPickerUiPatch) {
              if (!state || state.sessionId !== patch.sessionId || disposed) return;
              state = {
                ...state,
                ...patch,
                sessionId: state.sessionId,
                requests: patch.requests ?? state.requests,
                activeRequestId: patch.activeRequestId ?? state.activeRequestId,
                selections: patch.selections ?? state.selections,
                deadlineTs: patch.deadlineTs ?? state.deadlineTs,
                errorMessage: patch.errorMessage ?? state.errorMessage,
              };
              render();
            }

            function hide() {
              clearTimer();
              state = null;
              window.removeEventListener('keydown', onKey, true);
              host?.remove();
              host = null;
              shadow = null;
              root = null;
            }

            function dispose() {
              if (disposed) return;
              hide();
              disposed = true;
            }

            return { show, update, hide, isVisible: () => !!host && !!state, dispose };
          }
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare extension types
        run: pnpm --filter brauzio-extension exec wxt prepare

      - name: Build shared MCP schemas
        run: pnpm --filter brauzio-shared build

      - name: Check Cloudflare MCP
        run: pnpm --filter brauzio-cloud-mcp check

      - name: Compile extension
        id: compile
        shell: bash
        run: |
          set +e
          pnpm --filter brauzio-extension compile > FINAL_RESULT.txt 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build extension
        id: build
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set +e
          pnpm --filter brauzio-extension build >> FINAL_RESULT.txt 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit clean V2 when verified
        id: persist
        if: steps.compile.outputs.code == '0' && steps.build.outputs.code == '0'
        shell: bash
        run: |
          set -e
          rm -f CI_PROBE.md CI_PROBE_RESULT.txt PURGE_RESULT.txt PERSIST_RESULT.txt PR_DIAGNOSTIC.md FINAL_RESULT.txt
          rm -f .github/workflows/v2-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'refactor: finalize clean Brauzio V2 runtime [skip ci]'
          git push origin HEAD:v2-ci-probe

      - name: Report remaining errors
        if: steps.compile.outputs.code != '0' || steps.build.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Brauzio V2 final verification'
            echo
            echo '```text'
            tail -n 220 FINAL_RESULT.txt 2>/dev/null || true
            echo '```'
          } > FINAL_DIAGNOSTIC.md
          gh pr comment 1 --repo aseel90/Brauzio --body-file FINAL_DIAGNOSTIC.md

      - name: Fail when verification failed
        if: steps.compile.outputs.code != '0' || steps.build.outputs.code != '0'
        run: exit 1
