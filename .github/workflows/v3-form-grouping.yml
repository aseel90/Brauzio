name: Brauzio V3 Form Grouping

on:
  push:
    branches: [brauzio-v3-runtime]
    paths:
      - 'scripts/v3-form-grouping.py'
      - '.github/workflows/v3-form-grouping.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brauzio-v3-form-grouping
  cancel-in-progress: true

jobs:
  forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: python scripts/v3-form-grouping.py
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter brauzio-extension exec wxt prepare
      - run: pnpm --filter brauzio-shared build
      - run: pnpm --filter brauzio-extension compile
      - run: pnpm --filter brauzio-extension build
      - name: Commit validated form grouping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chrome-extension/entrypoints/background/runtime-v3/types.ts \
                  app/chrome-extension/entrypoints/background/runtime-v3/observation-service.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v3): add mechanical form grouping to observations [skip ci]'
            git push
          fi
