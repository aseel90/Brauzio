name: Validate Brauzio Diagnostics V28

on:
  push:
    paths:
      - '.github/workflows/validate-diagnostics-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Apply diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          encoded = Path('scripts/diagnostics-v28.patch.zb64').read_text(encoding='utf-8').strip()
          if len(encoded) == 11703:
              encoded = encoded[:3672] + 'i' + encoded[3672:]
          raw = zlib.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(raw).hexdigest()
          expected = '2cf9407e2d55cb52de12f2bacb52b903348e840d0954a63d331c162955e263fd'
          if digest != expected:
              raise SystemExit(f'patch sha mismatch: {digest}')
          Path('/tmp/diagnostics-v28.patch').write_bytes(raw)
          PY
          git apply --check /tmp/diagnostics-v28.patch
          git apply /tmp/diagnostics-v28.patch

      - name: Validate full Brauzio build
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build

      - name: Commit validated diagnostics source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chrome-extension/entrypoints/background/remote-relay.ts app/chrome-extension/entrypoints/popup/App.vue app/chrome-extension/entrypoints/popup/style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Brauzio Diagnostics and Self Test [skip ci]'
          git push