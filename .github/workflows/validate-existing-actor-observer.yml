name: Validate Existing Actor Observer

on:
  push:
    paths:
      - '.github/workflows/validate-existing-actor-observer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Apply repository Actor Observer staging logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          index = Path('app/cloudflare-mcp/src/index.ts')
          s = index.read_text(encoding='utf-8')
          s = s.replace("new URL('https://brauzio-browser.internal/call')", "new URL('https://brauzio-browser.internal/tool-call')", 1)
          s = s.replace("body: JSON.stringify({ name, args }),", "body: JSON.stringify({ name, arguments: args }),", 1)
          index.write_text(s, encoding='utf-8')

          session = Path('app/cloudflare-mcp/src/browser-session.ts')
          b = session.read_text(encoding='utf-8')
          b = b.replace('  private finishToolCall(message: ToolResultMessage) {', '  private finishToolCall(message: ToolResultMessage): void {', 1)
          session.write_text(b, encoding='utf-8')

          workflow = Path('.github/workflows/apply-actor-observer.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'apply-actor-observer.yml', 'exec'), {})
          PY

      - name: Validate full Brauzio build
        run: |
          pnpm --filter brauzio-shared build
          pnpm --filter brauzio-cloud-mcp check
          pnpm --filter brauzio-cloud-mcp build
          pnpm --filter brauzio-extension exec wxt prepare
          pnpm --filter brauzio-extension compile
          pnpm --filter brauzio-extension build

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cloudflare-mcp/src/index.ts app/cloudflare-mcp/src/browser-session.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Actor Observer lease foundation [skip ci]'
          git push
